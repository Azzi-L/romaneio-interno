<!doctype html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>ROMANEIO INTERNO</title>

<style>
:root{
  --bg:#f3f4f6;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#111827;
  --ok:#166534;
  --warn:#b45309
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text)
}

body.final-mode{
  background:#f3f4f6
}

body.final-mode header{
  display:none
}

body.final-mode main{
  max-width:720px;
  padding:18px 12px 30px
}

body.final-mode .editor-only{
  display:none!important
}

body.final-mode .final-card{
  display:block!important
}

body.final-mode .bottom{
  display:none!important
}

body.final-mode .final-actions{
  display:flex!important;
  flex-wrap:wrap
}

.final-actions{
  display:none;
  gap:8px;
  margin:12px 0 0
}

.final-actions button{
  flex:1;
  min-height:46px
}

.share-note{
  font-size:11px;
  color:var(--muted);
  text-align:center;
  margin-top:8px
}

header{
  background:var(--primary);
  color:white;
  padding:18px 16px 16px;
  position:sticky;
  top:0;
  z-index:10
}

h1{
  font-size:21px;
  margin:0 0 4px
}

.sub{
  font-size:13px;
  opacity:.75
}

main{
  max-width:720px;
  margin:auto;
  padding:14px 12px 100px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #00000008
}

label{
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  display:block;
  margin-bottom:6px
}

input{
  width:100%;
  height:46px;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:0 12px;
  font-size:16px;
  background:white
}

input:focus{
  outline:2px solid #9ca3af;
  border-color:#6b7280
}

.row{
  display:grid;
  grid-template-columns:1.05fr 1fr 1fr;
  gap:8px;
  align-items:end
}

.pallet-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px
}

.pallet-title{
  font-size:18px;
  font-weight:800
}

.badge{
  font-size:12px;
  padding:5px 8px;
  border-radius:999px;
  background:#f3f4f6;
  color:var(--muted)
}

.item{
  border-top:1px solid var(--line);
  padding:12px 0
}

.item:first-child{
  border-top:0;
  padding-top:0
}

.item-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px
}

.item-num{
  font-weight:700;
  font-size:14px
}

.item-status{
  font-size:11px;
  color:var(--warn)
}

.item-status.ok{
  color:var(--ok)
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

button{
  border:0;
  border-radius:11px;
  padding:12px 14px;
  font-weight:700;
  font-size:14px;
  cursor:pointer
}

.primary{
  background:#111827;
  color:white
}

.secondary{
  background:#eef0f2;
  color:#111827
}

.danger{
  background:#fee2e2;
  color:#991b1b
}

.full{
  width:100%;
  margin-top:4px
}

.summary{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px
}

.stat{
  background:#f9fafb;
  border-radius:12px;
  padding:12px
}

.stat b{
  display:block;
  font-size:20px;
  margin-top:3px
}

.stat span{
  font-size:12px;
  color:var(--muted)
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:white;
  border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  z-index:20
}

.bottom-inner{
  max-width:720px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.empty{
  padding:18px;
  text-align:center;
  color:var(--muted);
  font-size:14px
}

.small{
  font-size:12px;
  color:var(--muted);
  line-height:1.4
}

.pallet-bruto{
  margin:12px 0;
  padding:12px 0;
  border-top:1px solid var(--line)
}

.pallet-bruto label{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.pallet-bruto input{
  width:100%;
  box-sizing:border-box;
  margin-top:6px
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.info-grid .wide{
  grid-column:1/-1
}

.final-card{
  display:none;
  background:white;
  border:2px solid #111827;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px
}

.final-title{
  text-align:center;
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:16px
}

.final-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  border-bottom:1px solid var(--line);
  padding-bottom:14px;
  margin-bottom:14px
}

.final-field{
  background:#f9fafb;
  border-radius:10px;
  padding:10px
}

.final-field span{
  display:block;
  font-size:11px;
  color:var(--muted);
  font-weight:700;
  margin-bottom:3px
}

.final-field b{
  font-size:14px;
  word-break:break-word
}

.weight-total{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.weight-box{
  border-radius:12px;
  background:#f3f4f6;
  padding:13px;
  text-align:center
}

.weight-box span{
  display:block;
  font-size:11px;
  color:var(--muted);
  font-weight:700
}

.weight-box b{
  display:block;
  font-size:21px;
  margin-top:4px
}

@media(max-width:480px){
  .row{
    grid-template-columns:.9fr 1fr 1fr
  }

  input{
    height:48px
  }

  .pallet-title{
    font-size:17px
  }
}

.header-inner{
  max-width:980px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0
}

.brand-logo{
  width:58px;
  height:38px;
  object-fit:contain;
  display:block;
  background:transparent
}

.brand h1{
  margin:0;
  font-size:22px;
  line-height:1.1;
  letter-spacing:.3px
}

.header-new{
  white-space:nowrap
}

@media(max-width:600px){
  .header-inner{
    gap:10px
  }

  .brand{
    gap:9px
  }

  .brand-logo{
    width:58px;
    height:39px
  }

  .brand h1{
    font-size:18px
  }

  .header-new{
    padding:9px 11px!important
  }
}

.final-title-with-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px
}

.final-logo{
  width:62px;
  height:42px;
  object-fit:contain
}

button,
input{
  touch-action:manipulation;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">

      <img
        class="brand-logo"
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGgAAABECAYAAABtcnDsAAAEx0lEQVR4nO2cXahmUxjHf3sM0nDBKGJuJqGEQjMKJclnvgozzGhCYYbMDeUGRXOFksREk3IxZxgfhVHDkBiUMYXCBe5cGOEoH1M+Xxf7nLHedfaz9rP2Wmu/68xev5re9fHs/3r2+b/v3muvvfdUo9GIQr4smHQCBTfFoMwpBmVOMShzikGZUwzKnGJQ5hSDMqcYlDkxDdoOjKx/hUBiGXQ/cFFD+55I+oOlirQW5xKpYgwwVMo5KHNSG/RuYv39ntQGPZBYf78nhkHXOvreiaA/aGIYdGsEjYJAjFlcmcElpMziMielQW/NfK5n7gpD28/WXJU43+r7vEHr6gaNtxviPlDkbcYvNdqXN+g9rNALIuUhbgpYCRzgGl+pVzn6QuJMlgDfCrFTwPWeelFIfQ5S5WCUjwa+C9TT8BNwpNUWsh+7gDMDthcJPcStjJLF/zwWWU9icWS95ZH19hFq0G0RctholM+JoKfl0sh6Z0TWA8INOi9CDjcY5WMi6GlZYZSPjaAX+2gCpJ9mV7SfQA9Vak0DhzFuqMRqYBGw1xGz0Cjf16J3BO37sUiRlzcpDaqEss2fSr3FwG/A5pa4C6lnXXtx/9F2GWXXoboCfjbKEtMteXUilUHve8RqVrztP4xrmx3Kcbcq47R8GlkPCDNoqaPvGg+dTTOfp3hsc67Q7jNF19ztfc9D7yWPWDUhBq1z9H1v1c92xM5+k68IyGWWR6166Mzqeat+SKCeNyEGrfaI1UzHb+yYh8kzVn1FY9Q4Jzv6nrTqMb5EXoSsJPisYv+NvOTTtjyzg/rErxnbHncPcFRL7GZglVLvFWSTkiz39GWQJlaKWQVsMeoLgH8Cx90NLPPIrU3vL+Agh05nUszifB61+kgRs82qS992H16IoGHycmS9faQwyGc2c68i5lerLhn0h8e4zypiPvPQm/KI9aKrQa6lkec8dGbvGS10Ro1zidC+wUPDnmU28ZCH3qsesV50Nci13GJfpJ6l0FvTMQ+Tp6z6aYptLnD0bXH09UZXg9Z7xN6liHmwYx4mP1j12xXb3OPosycELjOT0XUW19cM7k3mPvOtnWKHjNuktxP5dkiyO6qTfGjkaUXM4wnG/bHjdpI5H3dNREMKg0ZC2UazumBPsWPc0NvYHgKM536nIy7Z3VTwmz35kOrdIGly8oWHxiMesRN/x2lSh7jrOuYg/ersRVIXv8x8nuixjcSy9pAwuhh0d4RxzVVin2+0xE6rrtG8I8K4uyNoOOli0EmBY9oznouFuE1CexNfWfUrFdus9dBvopfHmrsYdLPQrkm4KUZa7r+loe2ThrbtDW3HC5qXGeUDhRhofwCkt2fOu56DKupl+jeoL0Qro73pwnQt8k79O9O3AXgCuMkRezr1fajXqA+TS5CXfg4GvgS+of41VsDr0g5Z+WwFTmX8eYnfqa/Jen0hINY7qvMRace3AZf3mYiLYtBcTgC+7jMRF0N9/eQ4R1825sBwDbpq0gloGeohbho4XOjL6q3AoRo0b17bHOohTuLFSSdgM1SDpOUq138pMBGGeoiD+sH6ddTnog/RXcT2zpANmhcM9RA3bygGZU4xKHOKQZlTDMqcYlDmFIMypxiUOcWgzCkGZc5/VmPfNZasBw0AAAAASUVORK5CYII="

      <h1>ROMANEIO INTERNO</h1>

    </div>

    <button class="secondary header-new" onclick="novoRomaneio()">
      ＋ Novo
    </button>

  </div>
</header>

<main id="app"></main>

<div class="bottom">
  <div class="bottom-inner">

    <button class="secondary" onclick="addPallet()">
      ＋ Adicionar pallet
    </button>

    <button class="primary" onclick="finalizar()">
      ✓ Finalizar romaneio
    </button>

  </div>
</div>

<script>

const KEY="romaneio_mobile_v1";

let state=JSON.parse(localStorage.getItem(KEY)||"null") || {
  info:{
    cliente:"",
    item:"",
    lote:"",
    data:"",
    dimensao:""
  },

  pallets:[
    {
      id:1,
      items:Array.from(
        {length:5},
        (_,i)=>({
          numero:i+1,
          p1:""
        })
      )
    }
  ]
};

if(!state.info){
  state.info={
    cliente:"",
    item:"",
    lote:"",
    data:"",
    dimensao:""
  };
}

state.pallets.forEach(p=>{
  if(p.items){
    p.items.forEach(i=>{
      delete i.p2;
    });
  }
});

// Migração da versão antiga:
// remove os 15 itens extras quando eram apenas os itens padrão vazios.

state.pallets.forEach(p=>{

  if(p.items && p.items.length===20){

    const extrasVazios=
      p.items.slice(5).every(i=>
        String(i.numero??"")==="" ||
        Number(i.numero)===(p.items.indexOf(i)+1)
      )
      &&
      p.items.slice(5).every(i=>i.p1==="");

    if(extrasVazios){
      p.items=p.items.slice(0,5);
    }

  }

});

save();

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
}

function num(v){
  const n=parseFloat(
    String(v).replace(",",".")
  );

  return Number.isFinite(n)?n:0;
}

function fmt(v){
  return new Intl.NumberFormat(
    "pt-BR",
    {
      maximumFractionDigits:2
    }
  ).format(v);
}

function totals(){

  let p1=0;
  let items=0;
  let pending=0;

  state.pallets.forEach(p=>
    p.items.forEach(i=>{

      items++;

      p1+=num(i.p1);

      if(i.p1===""){
        pending++;
      }

    })
  );

  return {
    p1,
    items,
    pending
  };
}

function render(){

  const app=document.getElementById("app");

  let t=totals();

  let brutoTotal=
    state.pallets.reduce(
      (s,p)=>s+num(p.bruto),
      0
    );

  app.innerHTML="";

  const infoCard=document.createElement("div");

  infoCard.className="card editor-only";

  infoCard.innerHTML=`

    <div class="pallet-head">
      <div class="pallet-title">
        Dados do Romaneio
      </div>
    </div>

    <div class="info-grid">

      <div class="wide">
        <label>Cliente</label>

        <input
          value="${state.info.cliente}"
          onchange="updateInfo('cliente',this.value)"
          placeholder="Digite o cliente">
      </div>

      <div>
        <label>Item</label>

        <input
          value="${state.info.item}"
          onchange="updateInfo('item',this.value)"
          placeholder="Item">
      </div>

      <div>
        <label>Nº do lote</label>

        <input
          value="${state.info.lote}"
          onchange="updateInfo('lote',this.value)"
          placeholder="Lote">
      </div>

      <div>
        <label>Data de produção</label>

        <input
          type="date"
          value="${state.info.data}"
          onchange="updateInfo('data',this.value)">
      </div>

      <div>
        <label>Dimensão</label>

        <input
          value="${state.info.dimensao}"
          onchange="updateInfo('dimensao',this.value)"
          placeholder="Ex.: 100 x 200 mm">
      </div>

    </div>
  `;

  app.appendChild(infoCard);

  const finalCard=document.createElement("div");

  finalCard.className="final-card";

  finalCard.id="finalCard";

  finalCard.innerHTML=`

    <div class="final-title final-title-with-logo">

      <img
        class="final-logo"
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGgAAABECAYAAABtcnDsAAAEwklEQVR4nO2cXagVVRTH/2OGhPZwVVDKF6kIQgMVFVKQ8KOStKD8SMUv0PwgHywIQQXFJw0kQkW5KD50KysfSkFLidSETLBAfUjfeshQr6AmaKA9zL26z76z9qw1e+1z9nX2Dy5nf6z5z5rzPzOzZ8/MzdqGvohEvPRpdQIJN8mgyEkGRU4yKHKSQZGTDIqcZFDkJIMiJxkUOZoGHQHwwPpLeKJl0EYArxW0X1HSry2Z0lyca2/JNFZQV9I5KHJCG/RzYP3HntAGbQqs/9ijYdAsR99PCvq1RsOg5QoaCQINg6YoaCQI0iguckIadKzrcw16zjCUzTKYsxKTrb7zBVrvFGgcL4j7hZG3GT/caB9XoLeNoeeFxoUq9WV3AJgD4AnX+pl6maPPJ85kGIC/iNgOAO8J9VQIaRA7B6M8FMDfnnocrgMYbLX5bMcZAOM9lifxPcTNUcniEZ8q61EMUtYbp6z3EF+D3lfIYZdRnqigx2W6st4YZT0A/ga9qpDDAqP8jIIel9lG+VkFPe2jCYDww+wM5SfQAUytTgBPo9FQivkA+gO444jpa5Q3lOgNRPl29GfkJSakQRlRtrnH1BsE4DaAz0vipiEfdd2B+0s7Y5Rdh+oMwA2jTNFZklclQhl0ShDLmfG2vxjXMj8y13uAGcfld2U9AH4GDXf0vSvQae/6HClYZhLRLhmic+72nhDofSuIZeNj0EpH3z9WfYIjtvuXPNMjl262W3XfkdVXVv0pTz0xPgbNF8RyhuOLK+Zhsteqzy6MamSEo2+nVdf4EYnwMUgyJJ7HiHmeaOeeU4B8hsBkEWOZdQJ9znao0qzZbNd8XBn7rLok5yFE+1mjLPnSqT3oP4GGiBAGSR61+pURc8iqa/yKv1bQMDmorPeQEAZJRjPrGTG3rDpl0F3BevczYv4Q6HUIYkVUNcg1NfKlQKf7nlFfZ1QjbxDtWwQa9iiziK0Cve8EsSKqSabrEvUl9h6C2smIfJbqs+irHMVEffFx65qFHVoDWC2A8ZMZsr5mFy1aqvYizzsaPPvj/kMjMYVW/YSR715cRSMT+g5zPfVKzmeov0ToK+HRLsjmorHxrZw4j5LMB6r1VcjjLnt6qJcAhh0AOibMOZXbCH2Bo39HaVhwBozP0DR1ywu6mAbPQkIdS7QdTg5IJA4xNBbMvfcWrVIW5uxRyovc6eJHVxs+tT472bsQoaTqoY9JHCes1ZYskvmuKkVedorlZY79nyED+qGPSS5zrtEc/rRFw70V7En1b9LcYyKwT6RTTlxbQqBi0l2jkJF8VQ0/3LCtrOFbQdKWh7gdB80yg/ScQA5Q+ANO2twarnoAz5swFHkV+IZkZ70YXpCtAbdb+rbwuAHQCWOGJHI78P9T3yw9W+0FM//QBcBHAZ+d6YAThMbZCVzwEAL6PxeYl/kV+TNfWVTq13VHsj1AjtEIAZzUzERXq7oSdrW52ASV0Nes7Rd6lpWTCoq0FvtzoBLnU9B3UCaCP6ovq/DnXdgyhzoqOuBlF80+oEbOpqEDVd5fqXAi2hrucgIH+wfiXyw91p8C5im06dDeoV1PUQ12tIBkVOMihykkGRkwyKnGRQ5CSDIicZFDnJoMhJBkXO/98AqZdj7gSaAAAAAElFTkSuQmCC"
        alt="BMP">

      <span>ROMANEIO INTERNO</span>

    </div>

    <div class="final-info">

      <div class="final-field">
        <span>Cliente</span>
        <b id="f-cliente"></b>
      </div>

      <div class="final-field">
        <span>Item</span>
        <b id="f-item"></b>
      </div>

      <div class="final-field">
        <span>Nº do lote</span>
        <b id="f-lote"></b>
      </div>

      <div class="final-field">
        <span>Data de produção</span>
        <b id="f-data"></b>
      </div>

      <div class="final-field">
        <span>Dimensão</span>
        <b id="f-dimensao"></b>
      </div>

      <div class="final-field">
        <span>Pallets / Itens</span>
        <b id="f-qtd"></b>
      </div>

    </div>

    <div class="weight-total">

      <div class="weight-box">
        <span>Peso Líquido TOTAL</span>
        <b id="f-p1"></b>
      </div>

      <div class="weight-box">
        <span>Peso Bruto TOTAL</span>
        <b id="f-p2"></b>
      </div>

    </div>
  `;

  app.appendChild(finalCard);

  const finalActions=document.createElement("div");

  finalActions.className="final-actions";

  finalActions.innerHTML=`

    <button
      class="primary"
      onclick="compartilharImagem()">
      ↗ Compartilhar imagem
    </button>

    <button
      class="secondary"
      onclick="voltarEditar()">
      ← Voltar e alterar
    </button>

    <button
      class="secondary"
      onclick="novoRomaneio()">
      ＋ Novo romaneio
    </button>
  `;

  app.appendChild(finalActions);

  const top=document.createElement("div");

  top.className="card editor-only";

  top.innerHTML=`

    <div class="pallet-head">

      <div class="pallet-title">
        Resumo
      </div>

      <div class="badge">
        ${state.pallets.length}
        pallet${state.pallets.length==1?"":"s"}
      </div>

    </div>

    <div class="summary">

      <div class="stat">
        <span>Peso líquido total</span>
        <b>${fmt(t.p1)} kg</b>
      </div>

      <div class="stat">
        <span>Peso bruto total</span>
        <b>
          ${
            brutoTotal
            ? fmt(brutoTotal)+" kg"
            : "Não informado"
          }
        </b>
      </div>

      <div class="stat">
        <span>Itens</span>
        <b>${t.items}</b>
      </div>

      <div class="stat">
        <span>Pendências</span>
        <b>${t.pending}</b>
      </div>

    </div>
  `;

  app.appendChild(top);

  state.pallets.forEach((p,pi)=>{

    const card=document.createElement("section");

    card.className="card editor-only";

    card.innerHTML=`

      <div class="pallet-head">

        <div class="pallet-title">
          Pallet ${pi+1}
        </div>

        <div class="actions">

          ${
            state.pallets.length>1
            ?
            `<button
              class="danger"
              onclick="removePallet(${p.id})">
              Excluir
            </button>`
            :
            ""
          }

        </div>

      </div>

      <div
        class="small"
        style="margin-bottom:12px">

        Preencha o peso líquido de cada item.
        O peso bruto do pallet é opcional.

      </div>
    `;

    const list=document.createElement("div");

    p.items.forEach((it,ii)=>{

      const row=document.createElement("div");

      row.className="item";

      const complete=it.p1!=="";

      row.innerHTML=`

        <div class="item-head">

          <div class="item-num">
            Item ${ii+1}
          </div>

          <div class="actions">

            <div
              class="item-status ${complete?"ok":""}">

              ${
                complete
                ?
                "✓ preenchido"
                :
                "Pendente"
              }

            </div>

            <button
              class="danger"
              style="padding:7px 9px;font-size:11px"
              onclick="removeItem(${p.id},${ii})">

              Excluir item

            </button>

          </div>

        </div>

        <div class="row">

          <div>

            <label>Número</label>

            <input
              inputmode="numeric"
              value="${it.numero??""}"
              onchange="updateItem(${p.id},${ii},'numero',this.value)">

          </div>

          <div>

            <label>Peso líquido (kg)</label>

            <input
              inputmode="decimal"
              type="number"
              step="0.01"
              min="0"
              placeholder="0,00"
              value="${it.p1}"
              onchange="updateItem(${p.id},${ii},'p1',this.value)">

          </div>

        </div>
      `;

      list.appendChild(row);

    });

    card.appendChild(list);

    const bruto=document.createElement("div");

    bruto.className="pallet-bruto";

    bruto.innerHTML=`

      <label>
        Peso Bruto do pallet
        <span class="small">
          (opcional)
        </span>
      </label>

      <input
        inputmode="decimal"
        type="number"
        step="0.01"
        min="0"
        placeholder="0,00"
        value="${p.bruto??""}"
        onchange="updateBruto(${p.id},this.value)">
    `;

    card.appendChild(bruto);

    const b=document.createElement("button");

    b.className="secondary full";

    b.textContent="＋ Adicionar item";

    b.onclick=()=>addItem(p.id);

    card.appendChild(b);

    app.appendChild(card);

  });

}

function updateInfo(key,val){

  state.info[key]=val;

  save();

}

function updateBruto(pid,val){

  const p=state.pallets.find(
    x=>x.id===pid
  );

  if(p){

    p.bruto=val;

    save();

    render();

  }

}

function updateItem(pid,ii,key,val){

  const p=state.pallets.find(
    x=>x.id===pid
  );

  p.items[ii][key]=val;

  save();

  render();

}

function addItem(pid){

  const p=state.pallets.find(
    x=>x.id===pid
  );

  p.items.push({
    numero:p.items.length+1,
    p1:""
  });

  save();

  render();

}

function removeItem(pid,ii){

  const p=state.pallets.find(
    x=>x.id===pid
  );

  if(!p || p.items.length<=1){

    alert(
      "O pallet precisa ter pelo menos 1 item."
    );

    return;

  }

  if(
    !confirm(
      "Excluir este item?"
    )
  ){
    return;
  }

  p.items.splice(ii,1);

  save();

  render();

}

function addPallet(){

  state.pallets.push({

    id:Date.now(),

    items:Array.from(
      {length:5},
      (_,i)=>({
        numero:i+1,
        p1:""
      })
    )

  });

  save();

  render();

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}

function removePallet(pid){

  if(
    !confirm(
      "Excluir este pallet e todos os seus itens?"
    )
  ){
    return;
  }

  state.pallets=
    state.pallets.filter(
      p=>p.id!==pid
    );

  save();

  render();

}

function finalizar(){

  const t=totals();

  if(t.pending>0){

    alert(
      `Ainda existem ${t.pending} item(ns) sem peso líquido preenchido.`
    );

    return;

  }

  const required=[

    ["Cliente",state.info.cliente],

    ["Item",state.info.item],

    ["Nº do lote",state.info.lote],

    ["Data de produção",state.info.data],

    ["Dimensão",state.info.dimensao]

  ];

  const missing=
    required
      .filter(x=>!x[1])
      .map(x=>x[0]);

  if(missing.length){

    alert(
      "Preencha antes de finalizar:\n\n"+
      missing.join("\n")
    );

    return;

  }

  const brutoTotal=
    state.pallets.reduce(
      (s,p)=>s+num(p.bruto),
      0
    );

  document
    .getElementById("finalCard")
    .style.display="block";

  document.getElementById(
    "f-cliente"
  ).textContent=state.info.cliente;

  document.getElementById(
    "f-item"
  ).textContent=state.info.item;

  document.getElementById(
    "f-lote"
  ).textContent=state.info.lote;

  document.getElementById(
    "f-data"
  ).textContent=
    state.info.data
      .split("-")
      .reverse()
      .join("/");

  document.getElementById(
    "f-dimensao"
  ).textContent=state.info.dimensao;

  document.getElementById(
    "f-qtd"
  ).textContent=
    `${state.pallets.length} pallet${
      state.pallets.length==1?"":"s"
    } / ${t.items} itens`;

  document.getElementById(
    "f-p1"
  ).textContent=
    fmt(t.p1)+" kg";

  document.getElementById(
    "f-p2"
  ).textContent=
    brutoTotal
    ?
    fmt(brutoTotal)+" kg"
    :
    "Não informado";

  document.body.classList.add(
    "final-mode"
  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function novoRomaneio(){

  if(
    !confirm(
      "Iniciar um novo romaneio? Todas as informações e pesos preenchidos serão apagados."
    )
  ){
    return;
  }

  state={

    info:{
      cliente:"",
      item:"",
      lote:"",
      data:"",
      dimensao:""
    },

    pallets:[
      {
        id:Date.now(),

        items:Array.from(
          {length:5},
          (_,i)=>({
            numero:i+1,
            p1:""
          })
        )

      }
    ]

  };

  save();

  document.body.classList.remove(
    "final-mode"
  );

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function voltarEditar(){

  document.body.classList.remove(
    "final-mode"
  );

  document
    .getElementById("finalCard")
    .style.display="none";

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function escapeXml(v){

  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}

async function compartilharImagem(){

  const svg=criarImagemRomaneio();

  const blobSvg=
    new Blob(
      [svg],
      {
        type:"image/svg+xml;charset=utf-8"
      }
    );

  const url=
    URL.createObjectURL(blobSvg);

  const img=new Image();

  img.onload=async ()=>{

    const canvas=
      document.createElement("canvas");

    canvas.width=1800;
    canvas.height=1520;

    const ctx=
      canvas.getContext("2d");

    ctx.drawImage(
      img,
      0,
      0,
      1800,
      1520
    );

    URL.revokeObjectURL(url);

    canvas.toBlob(
      async blob=>{

        if(!blob){
          return;
        }

        const file=
          new File(
            [blob],
            "romaneio-interno.png",
            {
              type:"image/png"
            }
          );

        try{

          if(
            navigator.share &&
            (
              !navigator.canShare ||
              navigator.canShare({
                files:[file]
              })
            )
          ){

            await navigator.share({
              title:"Romaneio Interno",
              files:[file]
            });

          }else{

            const a=
              document.createElement("a");

            a.href=
              URL.createObjectURL(blob);

            a.download=
              "romaneio-interno.png";

            a.click();

            setTimeout(
              ()=>URL.revokeObjectURL(a.href),
              1000
            );

            alert(
              "A imagem foi gerada. No computador, ela será salva como arquivo PNG."
            );

          }

        }catch(e){

          if(e.name!=="AbortError"){

            alert(
              "Não foi possível compartilhar a imagem neste dispositivo."
            );

          }

        }

      },
      "image/png"
    );

  };

  img.src=url;

}
