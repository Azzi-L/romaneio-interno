<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#111827">

<title>ROMANEIO INTERNO</title>

<style>

:root{
    --bg:#f3f4f6;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --primary:#111827;
    --secondary:#eef0f2;
    --danger-bg:#fee2e2;
    --danger:#991b1b;
    --ok:#166534;
    --warning:#b45309;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:100px;
}

header{
    background:var(--primary);
    color:#fff;
    padding:18px 16px;
    position:sticky;
    top:0;
    z-index:10;
}

.header-inner{
    max-width:980px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand h1{
    margin:0;
    font-size:22px;
    letter-spacing:.3px;
}

main{
    max-width:720px;
    margin:auto;
    padding:14px 12px 100px;
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.03);
}

.pallet-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.pallet-title{
    font-size:18px;
    font-weight:800;
}

.badge{
    font-size:12px;
    padding:5px 9px;
    border-radius:999px;
    background:#f3f4f6;
    color:var(--muted);
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.info-grid .wide{
    grid-column:1 / -1;
}

label{
    display:block;
    margin-bottom:6px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}

input{
    width:100%;
    height:46px;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:0 12px;
    font-size:16px;
    background:#fff;
}

input:focus{
    outline:2px solid #9ca3af;
    border-color:#6b7280;
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.stat{
    background:#f9fafb;
    border-radius:12px;
    padding:12px;
}

.stat span{
    display:block;
    color:var(--muted);
    font-size:12px;
}

.stat b{
    display:block;
    font-size:20px;
    margin-top:4px;
}

.item{
    border-top:1px solid var(--line);
    padding:12px 0;
}

.item:first-child{
    border-top:0;
    padding-top:0;
}

.item-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
}

.item-num{
    font-size:14px;
    font-weight:700;
}

.item-status{
    font-size:11px;
    color:var(--warning);
}

.item-status.ok{
    color:var(--ok);
}

.item-fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:11px;
    padding:12px 14px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
}

.primary{
    background:var(--primary);
    color:#fff;
}

.secondary{
    background:var(--secondary);
    color:var(--text);
}

.danger{
    background:var(--danger-bg);
    color:var(--danger);
}

.full{
    width:100%;
    margin-top:5px;
}

.small{
    font-size:12px;
    color:var(--muted);
    line-height:1.4;
}

.pallet-bruto{
    border-top:1px solid var(--line);
    margin-top:10px;
    padding-top:12px;
}

.pallet-bruto-title{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
    margin-bottom:6px;
}

.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#fff;
    border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    z-index:20;
}

.bottom-inner{
    max-width:720px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.final-card{
    display:none;
    background:#fff;
    border:2px solid #111827;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
}

.final-title{
    text-align:center;
    font-size:22px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:16px;
}

.final-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:14px;
}

.final-field{
    background:#f9fafb;
    border-radius:10px;
    padding:10px;
}

.final-field span{
    display:block;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    margin-bottom:4px;
}

.final-field b{
    display:block;
    font-size:14px;
    word-break:break-word;
}

.weight-total{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.weight-box{
    background:#f3f4f6;
    border-radius:12px;
    padding:14px;
    text-align:center;
}

.weight-box span{
    display:block;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}

.weight-box b{
    display:block;
    font-size:23px;
    margin-top:5px;
}

.final-actions{
    display:none;
    gap:8px;
    flex-wrap:wrap;
}

.final-actions button{
    flex:1;
    min-height:46px;
}

body.final-mode header{
    display:none;
}

body.final-mode .editor-only{
    display:none !important;
}

body.final-mode .bottom{
    display:none;
}

body.final-mode .final-card{
    display:block;
}

body.final-mode .final-actions{
    display:flex;
}

body.final-mode main{
    max-width:720px;
    padding-top:18px;
}

@media(max-width:600px){

    .brand h1{
        font-size:19px;
    }

    .info-grid{
        grid-template-columns:1fr 1fr;
    }

    .item-fields{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:420px){

    .brand h1{
        font-size:18px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .info-grid .wide{
        grid-column:auto;
    }

    .summary{
        grid-template-columns:1fr 1fr;
    }

    .item-fields{
        grid-template-columns:1fr;
    }

    .final-info{
        grid-template-columns:1fr 1fr;
    }

}

</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="brand">
            <h1>ROMANEIO INTERNO</h1>
        </div>

        <button
            class="secondary"
            onclick="novoRomaneio()">
            ＋ Novo
        </button>

    </div>

</header>


<main id="app"></main>


<div class="bottom">

    <div class="bottom-inner">

        <button
            class="secondary"
            onclick="adicionarPallet()">
            ＋ Adicionar pallet
        </button>

        <button
            class="primary"
            onclick="finalizar()">
            ✓ Finalizar romaneio
        </button>

    </div>

</div>


<script>

const STORAGE_KEY = "romaneio_interno_v1";


let state =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || criarEstadoInicial();


function criarEstadoInicial(){

    return {

        info:{
            cliente:"",
            item:"",
            lote:"",
            data:"",
            dimensao:""
        },

        pallets:[
            criarPallet()
        ]

    };

}


function criarPallet(){

    return {

        id:Date.now() + Math.random(),

        bruto:"",

        items:Array.from(
            {length:5},
            (_,i)=>({

                numero:i+1,

                p1:""

            })
        )

    };

}


function salvar(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

}


function numero(valor){

    const n =
        parseFloat(
            String(valor)
                .replace(",",".")
        );

    return Number.isFinite(n)
        ? n
        : 0;

}


function formatarPeso(valor){

    return new Intl.NumberFormat(
        "pt-BR",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    ).format(valor);

}


function totais(){

    let liquido = 0;

    let itens = 0;

    let pendencias = 0;


    state.pallets.forEach(
        pallet=>{

            pallet.items.forEach(
                item=>{

                    itens++;

                    liquido += numero(
                        item.p1
                    );

                    if(
                        item.p1 === "" ||
                        item.p1 === null ||
                        item.p1 === undefined
                    ){

                        pendencias++;

                    }

                }
            );

        }
    );


    return {

        liquido,

        itens,

        pendencias

    };

}


function brutoTotal(){

    return state.pallets.reduce(
        (total,pallet)=>
            total + numero(pallet.bruto),
        0
    );

}


function render(){

    const app =
        document.getElementById("app");


    app.innerHTML = "";


    criarCardInformacoes(app);


    criarCardResumo(app);


    state.pallets.forEach(
        (pallet,index)=>
            criarCardPallet(
                app,
                pallet,
                index
            )
    );


    criarCardFinal(app);


    criarBotoesFinais(app);

}


function criarCardInformacoes(app){

    const card =
        document.createElement("section");

    card.className =
        "card editor-only";


    card.innerHTML = `

        <div class="pallet-head">

            <div class="pallet-title">
                Dados do Romaneio
            </div>

        </div>


        <div class="info-grid">

            <div class="wide">

                <label>Cliente</label>

                <input
                    type="text"
                    value="${esc(state.info.cliente)}"
                    placeholder="Digite o cliente"
                    onchange="
                        alterarInfo(
                            'cliente',
                            this.value
                        )
                    "
                >

            </div>


            <div>

                <label>Item</label>

                <input
                    type="text"
                    value="${esc(state.info.item)}"
                    placeholder="Item"
                    onchange="
                        alterarInfo(
                            'item',
                            this.value
                        )
                    "
                >

            </div>


            <div>

                <label>Nº do lote</label>

                <input
                    type="text"
                    value="${esc(state.info.lote)}"
                    placeholder="Lote"
                    onchange="
                        alterarInfo(
                            'lote',
                            this.value
                        )
                    "
                >

            </div>


            <div>

                <label>Data de produção</label>

                <input
                    type="date"
                    value="${esc(state.info.data)}"
                    onchange="
                        alterarInfo(
                            'data',
                            this.value
                        )
                    "
                >

            </div>


            <div>

                <label>Dimensão</label>

                <input
                    type="text"
                    value="${esc(state.info.dimensao)}"
                    placeholder="Ex.: 100 x 200 mm"
                    onchange="
                        alterarInfo(
                            'dimensao',
                            this.value
                        )
                    "
                >

            </div>

        </div>

    `;


    app.appendChild(card);

}


function criarCardResumo(app){

    const t = totais();


    const card =
        document.createElement("section");


    card.className =
        "card editor-only";


    const bruto =
        brutoTotal();


    card.innerHTML = `

        <div class="pallet-head">

            <div class="pallet-title">
                Resumo
            </div>

            <div class="badge">

                ${state.pallets.length}
                pallet${state.pallets.length === 1 ? "" : "s"}

            </div>

        </div>


        <div class="summary">

            <div class="stat">

                <span>
                    Peso Líquido Total
                </span>

                <b>
                    ${formatarPeso(t.liquido)} kg
                </b>

            </div>


            <div class="stat">

                <span>
                    Peso Bruto Total
                </span>

                <b>
                    ${
                        bruto > 0
                        ? formatarPeso(bruto) + " kg"
                        : "Não informado"
                    }
                </b>

            </div>


            <div class="stat">

                <span>
                    Itens
                </span>

                <b>
                    ${t.itens}
                </b>

            </div>


            <div class="stat">

                <span>
                    Pendências
                </span>

                <b>
                    ${t.pendencias}
                </b>

            </div>

        </div>

    `;


    app.appendChild(card);

}


function criarCardPallet(
    app,
    pallet,
    index
){

    const card =
        document.createElement("section");


    card.className =
        "card editor-only";


    card.innerHTML = `

        <div class="pallet-head">

            <div class="pallet-title">

                Pallet ${index + 1}

            </div>


            <div class="actions">

                ${
                    state.pallets.length > 1

                    ?

                    `
                    <button
                        class="danger"
                        onclick="
                            removerPallet(
                                '${pallet.id}'
                            )
                        "
                    >
                        Excluir
                    </button>
                    `

                    :

                    ""
                }

            </div>

        </div>


        <div class="small">

            Preencha o peso líquido de cada item.
            O peso bruto do pallet é opcional.

        </div>

    `;


    pallet.items.forEach(
        (item,itemIndex)=>{

            const preenchido =
                item.p1 !== "" &&
                Number.isFinite(
                    numero(item.p1)
                );


            const itemDiv =
                document.createElement("div");


            itemDiv.className =
                "item";


            itemDiv.innerHTML = `

                <div class="item-head">

                    <div class="item-num">
                        Item ${itemIndex + 1}
                    </div>


                    <div class="
                        item-status
                        ${preenchido ? "ok" : ""}
                    ">

                        ${
                            preenchido
                            ? "✓ preenchido"
                            : ""
                        }

                    </div>

                </div>


                <div class="item-fields">

                    <div>

                        <label>
                            Número
                        </label>

                        <input
                            type="number"
                            value="${item.numero}"
                            onchange="
                                alterarNumero(
                                    '${pallet.id}',
                                    ${itemIndex},
                                    this.value
                                )
                            "
                        >

                    </div>


                    <div>

                        <label>
                            Peso líquido (kg)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            inputmode="decimal"
                            value="${esc(item.p1)}"
                            placeholder="0,00"
                            oninput="
                                alterarLiquido(
                                    '${pallet.id}',
                                    ${itemIndex},
                                    this.value
                                )
                            "
                        >

                    </div>

                </div>

            `;


            card.appendChild(itemDiv);

        }
    );


    if(pallet.items.length < 5){

        const adicionar =
            document.createElement("button");


        adicionar.className =
            "secondary full";


        adicionar.textContent =
            "＋ Adicionar item";


        adicionar.onclick =
            ()=>adicionarItem(pallet.id);


        card.appendChild(adicionar);

    }


    const bruto =
        document.createElement("div");


    bruto.className =
        "pallet-bruto";


    bruto.innerHTML = `

        <div class="pallet-bruto-title">

            Peso Bruto do pallet
            (opcional)

        </div>


        <input
            type="number"
            step="0.01"
            min="0"
            inputmode="decimal"
            placeholder="0,00"
            value="${esc(pallet.bruto || "")}"
            onchange="
                alterarBruto(
                    '${pallet.id}',
                    this.value
                )
            "
        >

    `;


    card.appendChild(bruto);


    app.appendChild(card);

}


function criarCardFinal(app){

    const card =
        document.createElement("section");


    card.className =
        "final-card";


    card.id =
        "finalCard";


    card.innerHTML = `

        <div class="final-title">

            ROMANEIO INTERNO

        </div>


        <div class="final-info">

            <div class="final-field">

                <span>
                    Cliente
                </span>

                <b id="f-cliente"></b>

            </div>


            <div class="final-field">

                <span>
                    Item
                </span>

                <b id="f-item"></b>

            </div>


            <div class="final-field">

                <span>
                    Nº do lote
                </span>

                <b id="f-lote"></b>

            </div>


            <div class="final-field">

                <span>
                    Data de produção
                </span>

                <b id="f-data"></b>

            </div>


            <div class="final-field">

                <span>
                    Dimensão
                </span>

                <b id="f-dimensao"></b>

            </div>


            <div class="final-field">

                <span>
                    Pallets / Itens
                </span>

                <b id="f-qtd"></b>

            </div>

        </div>


        <div class="weight-total">

            <div class="weight-box">

                <span>
                    Peso Líquido Total
                </span>

                <b id="f-p1"></b>

            </div>


            <div class="weight-box">

                <span>
                    Peso Bruto Total
                </span>

                <b id="f-p2"></b>

            </div>

        </div>

    `;


    app.appendChild(card);

}


function criarBotoesFinais(app){

    const div =
        document.createElement("div");


    div.className =
        "final-actions";


    div.innerHTML = `

        <button
            class="primary"
            onclick="compartilharImagem()"
        >
            ↗ Compartilhar imagem
        </button>


        <button
            class="secondary"
            onclick="voltarEditar()"
        >
            ← Voltar e alterar
        </button>


        <button
            class="secondary"
            onclick="novoRomaneio()"
        >
            ＋ Novo romaneio
        </button>

    `;


    app.appendChild(div);

}


function alterarInfo(
    campo,
    valor
){

    state.info[campo] =
        valor;


    salvar();

}


function localizarPallet(id){

    return state.pallets.find(
        pallet =>
            String(pallet.id) === String(id)
    );

}


function alterarNumero(
    palletId,
    itemIndex,
    valor
){

    const pallet =
        localizarPallet(palletId);


    if(!pallet){
        return;
    }


    pallet.items[itemIndex].numero =
        valor;


    salvar();

}


function alterarLiquido(
    palletId,
    itemIndex,
    valor
){

    const pallet =
        localizarPallet(palletId);


    if(!pallet){
        return;
    }


    pallet.items[itemIndex].p1 =
        valor;


    salvar();


    atualizarResumo();

}


function atualizarResumo(){

    const t =
        totais();


    const bruto =
        brutoTotal();


    const estatisticas =
        document.querySelectorAll(
            ".stat b"
        );


    if(estatisticas.length >= 4){

        estatisticas[0].textContent =
            formatarPeso(t.liquido) + " kg";


        estatisticas[1].textContent =
            bruto > 0
            ? formatarPeso(bruto) + " kg"
            : "Não informado";


        estatisticas[2].textContent =
            t.itens;


        estatisticas[3].textContent =
            t.pendencias;

    }

}


function alterarBruto(
    palletId,
    valor
){

    const pallet =
        localizarPallet(palletId);


    if(!pallet){
        return;
    }


    pallet.bruto =
        valor;


    salvar();


    render();

}


function adicionarItem(
    palletId
){

    const pallet =
        localizarPallet(palletId);


    if(!pallet){
        return;
    }


    if(pallet.items.length >= 5){

        alert(
            "Cada pallet pode ter no máximo 5 itens."
        );

        return;

    }


    pallet.items.push({

        numero:
            pallet.items.length + 1,

        p1:""

    });


    salvar();

    render();

}


function removerItem(
    palletId,
    itemIndex
){

    const pallet =
        localizarPallet(palletId);


    if(!pallet){
        return;
    }


    if(pallet.items.length <= 1){

        alert(
            "O pallet precisa ter pelo menos 1 item."
        );

        return;

    }


    if(
        !confirm(
            "Excluir este item?"
        )
    ){

        return;

    }


    pallet.items.splice(
        itemIndex,
        1
    );


    pallet.items.forEach(
        (item,index)=>{
            item.numero =
                index + 1;
        }
    );


    salvar();

    render();

}


function adicionarPallet(){

    state.pallets.push(
        criarPallet()
    );


    salvar();

    render();


    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}


function removerPallet(id){

    if(
        state.pallets.length <= 1
    ){

        alert(
            "O romaneio precisa ter pelo menos 1 pallet."
        );

        return;

    }


    if(
        !confirm(
            "Excluir este pallet e todos os seus itens?"
        )
    ){

        return;

    }


    state.pallets =
        state.pallets.filter(
            pallet =>
                String(pallet.id)
                !== String(id)
        );


    salvar();

    render();

}


function finalizar(){

    const t =
        totais();


    if(t.pendencias > 0){

        alert(
            "Ainda existem " +
            t.pendencias +
            " item(ns) sem peso líquido preenchido."
        );

        return;

    }


    const campos = [

        ["Cliente",state.info.cliente],

        ["Item",state.info.item],

        ["Nº do lote",state.info.lote],

        ["Data de produção",state.info.data],

        ["Dimensão",state.info.dimensao]

    ];


    const faltando =
        campos
            .filter(
                campo =>
                    !String(campo[1] || "").trim()
            )
            .map(
                campo =>
                    campo[0]
            );


    if(faltando.length > 0){

        alert(
            "Preencha antes de finalizar:\n\n" +
            faltando.join("\n")
        );

        return;

    }


    const bruto =
        brutoTotal();


    document.getElementById(
        "f-cliente"
    ).textContent =
        state.info.cliente;


    document.getElementById(
        "f-item"
    ).textContent =
        state.info.item;


    document.getElementById(
        "f-lote"
    ).textContent =
        state.info.lote;


    document.getElementById(
        "f-data"
    ).textContent =
        formatarData(
            state.info.data
        );


    document.getElementById(
        "f-dimensao"
    ).textContent =
        state.info.dimensao;


    document.getElementById(
        "f-qtd"
    ).textContent =

        state.pallets.length +
        (
            state.pallets.length === 1
            ? " pallet"
            : " pallets"
        ) +
        " / " +
        t.itens +
        " itens";


    document.getElementById(
        "f-p1"
    ).textContent =
        formatarPeso(t.liquido) +
        " kg";


    document.getElementById(
        "f-p2"
    ).textContent =

        bruto > 0
        ? formatarPeso(bruto) + " kg"
        : "Não informado";


    document.body.classList.add(
        "final-mode"
    );


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


function formatarData(data){

    if(!data){
        return "";
    }


    const partes =
        data.split("-");


    if(partes.length !== 3){
        return data;
    }


    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


function voltarEditar(){

    document.body.classList.remove(
        "final-mode"
    );


    render();


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


function novoRomaneio(){

    if(
        !confirm(
            "Iniciar um novo romaneio? Todas as informações e pesos preenchidos serão apagados."
        )
    ){

        return;

    }


    state =
        criarEstadoInicial();


    salvar();


    document.body.classList.remove(
        "final-mode"
    );


    render();


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


function esc(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

async function compartilharImagem(){

    const svg =
        criarImagemRomaneio();


    const blobSvg =
        new Blob(
            [svg],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blobSvg
        );


    const imagem =
        new Image();


    imagem.onload =
        async function(){

            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width = 1800;

            canvas.height = 1520;


            const ctx =
                canvas.getContext("2d");


            ctx.drawImage(
                imagem,
                0,
                0,
                1800,
                1520
            );


            URL.revokeObjectURL(
                url
            );


            canvas.toBlob(
                async function(blob){

                    if(!blob){
                        return;
                    }


                    const arquivo =
                        new File(
                            [blob],
                            "romaneio-interno.png",
                            {
                                type:
                                    "image/png"
                            }
                        );


                    try{

                        if(
                            navigator.share &&
                            (
                                !navigator.canShare ||
                                navigator.canShare({
                                    files:[arquivo]
                                })
                            )
                        ){

                            await navigator.share({

                                title:
                                    "Romaneio Interno",

                                files:[
                                    arquivo
                                ]

                            });

                        }else{

                            const link =
                                document.createElement(
                                    "a"
                                );


                            link.href =
                                URL.createObjectURL(
                                    blob
                                );


                            link.download =
                                "romaneio-interno.png";


                            link.click();


                            setTimeout(
                                ()=>{
                                    URL.revokeObjectURL(
                                        link.href
                                    );
                                },
                                1000
                            );

                        }

                    }catch(erro){

                        if(
                            erro.name !==
                            "AbortError"
                        ){

                            alert(
                                "Não foi possível compartilhar a imagem neste dispositivo."
                            );

                        }

                    }

                },
                "image/png"
            );

        };


    imagem.src = url;

}


render();
