<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>ROMANEIO INTERNO</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f1f3f6;
    color: #111827;
    padding-bottom: 100px;
}

.header {
    height: 84px;
    background: #111827;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 22px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.header-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: .3px;
}

.header-new {
    margin-left: auto;
    border: none;
    background: #f3f4f6;
    color: #111827;
    border-radius: 13px;
    padding: 12px 18px;
    font-size: 16px;
    font-weight: 700;
}

.container {
    max-width: 700px;
    margin: 16px auto;
    padding: 0 14px;
}

.card {
    background: white;
    border: 1px solid #e1e5ea;
    border-radius: 17px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 7px rgba(0,0,0,.04);
}

.card-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 14px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;
    color: #475569;
    margin-bottom: 6px;
}

input {
    width: 100%;
    height: 46px;
    border: 1px solid #cbd5e1;
    border-radius: 11px;
    padding: 0 12px;
    font-size: 16px;
    background: white;
    color: #111827;
    outline: none;
}

input:focus {
    border-color: #111827;
}

.summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.summary-box {
    background: #f7f8fa;
    border-radius: 13px;
    padding: 13px;
}

.summary-label {
    font-size: 13px;
    color: #64748b;
}

.summary-value {
    font-size: 21px;
    font-weight: 800;
    margin-top: 4px;
}

.pallet-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.pallet-title h2 {
    margin: 0;
    font-size: 20px;
}

.remove-pallet {
    border: none;
    background: #fee2e2;
    color: #b91c1c;
    border-radius: 9px;
    padding: 8px 10px;
    font-weight: 700;
}

.help {
    color: #64748b;
    font-size: 13px;
    margin: 8px 0 16px;
}

.item {
    border-top: 1px solid #e5e7eb;
    padding-top: 14px;
    margin-top: 14px;
}

.item:first-of-type {
    border-top: none;
    padding-top: 0;
    margin-top: 0;
}

.item-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 9px;
}

.item-name {
    font-weight: 800;
}

.item-status {
    color: #008a4b;
    font-size: 12px;
}

.remove-item {
    border: none;
    background: #fee2e2;
    color: #b91c1c;
    border-radius: 9px;
    padding: 7px 10px;
    font-weight: 700;
}

.item-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.bruto {
    margin-top: 15px;
    padding-top: 14px;
    border-top: 1px dashed #d1d5db;
}

.bruto-title {
    font-size: 13px;
    color: #475569;
    margin-bottom: 6px;
}

.add-item {
    width: 100%;
    height: 44px;
    margin-top: 14px;
    border: 1px dashed #94a3b8;
    background: #f8fafc;
    border-radius: 11px;
    font-weight: 700;
    color: #334155;
}

.bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: white;
    border-top: 1px solid #dbe0e6;
    padding: 10px 14px;
    display: flex;
    gap: 8px;
    z-index: 30;
}

.bottom button {
    flex: 1;
    height: 48px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
}

.btn-light {
    background: #eef0f2;
    color: #111827;
}

.btn-dark {
    background: #111827;
    color: white;
}

.final-page {
    padding: 20px 14px 30px;
}

.final-card {
    max-width: 700px;
    margin: 0 auto;
    background: white;
    border: 1.5px solid #111827;
    border-radius: 18px;
    padding: 18px;
}

.final-header {
    display: flex;
    justify-content: center;
    align-items: center;
    border-bottom: 2px solid #e5e7eb;
    padding-bottom: 17px;
    margin-bottom: 18px;
}

.final-title {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 1px;
}

.final-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.final-info {
    background: #f7f8fa;
    border-radius: 12px;
    padding: 12px;
}

.final-label {
    color: #6b7280;
    font-size: 13px;
}

.final-value {
    font-weight: 800;
    font-size: 16px;
    margin-top: 4px;
}

.final-line {
    border-top: 2px solid #e5e7eb;
    margin: 18px 0;
}

.final-weight-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.final-weight {
    background: #f3f4f6;
    border-radius: 15px;
    text-align: center;
    padding: 22px 10px;
}

.final-weight-label {
    color: #6b7280;
    font-size: 15px;
    text-transform: uppercase;
}

.final-weight-value {
    font-size: 30px;
    font-weight: 900;
    margin-top: 10px;
}

.final-footer {
    text-align: center;
    color: #6b7280;
    margin-top: 70px;
    font-size: 14px;
}

.final-buttons {
    max-width: 700px;
    margin: 14px auto 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
}

.final-buttons button {
    height: 48px;
    border: none;
    border-radius: 12px;
    font-weight: 800;
    font-size: 14px;
}

.share {
    background: #111827;
    color: white;
}

.back {
    background: #eef0f2;
}

.new {
    background: #eef0f2;
}

@media(max-width:600px) {

    .header {
        height: 82px;
        padding: 0 16px;
    }

    .header-title {
        font-size: 21px;
    }

    .grid,
    .summary-grid,
    .final-grid,
    .final-weight-grid,
    .item-fields {
        grid-template-columns: 1fr 1fr;
    }

    .final-title {
        font-size: 22px;
    }

    .final-buttons button {
        font-size: 12px;
    }
}

</style>

</head>

<body>

<div id="app"></div>

<script>

let pallets = [
    {
        items: [
            {
                numero: 1,
                liquido: ""
            }
        ],
        bruto: ""
    }
];

let dados = {
    cliente: "",
    item: "",
    lote: "",
    data: "",
    dimensao: ""
};

let telaFinal = false;


// ------------------------------------------------------------
// DATA
// ------------------------------------------------------------

function dataHoje() {

    const d = new Date();

    const ano = d.getFullYear();

    const mes =
        String(d.getMonth() + 1).padStart(2, "0");

    const dia =
        String(d.getDate()).padStart(2, "0");

    return ano + "-" + mes + "-" + dia;
}

dados.data = dataHoje();


// ------------------------------------------------------------
// ESCAPE
// ------------------------------------------------------------

function escapeHtml(text) {

    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ------------------------------------------------------------
// FORMATA DATA
// ------------------------------------------------------------

function formatarData(valor) {

    if (!valor) return "";

    const partes = valor.split("-");

    if (partes.length !== 3) {
        return valor;
    }

    return partes[2] +
           "/" +
           partes[1] +
           "/" +
           partes[0];
}


// ------------------------------------------------------------
// FORMATA PESO
// ------------------------------------------------------------

function formatPeso(valor) {

    if (!valor) {
        return "0";
    }

    return Number(valor).toLocaleString(
        "pt-BR",
        {
            maximumFractionDigits: 2
        }
    );
}


// ------------------------------------------------------------
// PENDÊNCIAS
// ------------------------------------------------------------

function calcularPendencias() {

    let pendencias = 0;

    pallets.forEach(p => {

        p.items.forEach(i => {

            if (
                i.liquido === "" ||
                isNaN(parseFloat(i.liquido))
            ) {
                pendencias++;
            }

        });

    });

    return pendencias;
}


// ------------------------------------------------------------
// RENDER
// ------------------------------------------------------------

function render() {

    if (telaFinal) {

        renderFinal();

        return;
    }

    let html = "";

    html += `

    <div class="header">

        <div class="header-title">
            ROMANEIO INTERNO
        </div>

        <button
            class="header-new"
            onclick="novoRomaneio()">

            + Novo

        </button>

    </div>

    `;


    html += `
    <div class="container">
    `;


    // --------------------------------------------------------
    // DADOS
    // --------------------------------------------------------

    html += `

    <div class="card">

        <div class="card-title">
            Dados do Romaneio
        </div>

        <div class="grid">

            <div class="field full">

                <label>
                    Cliente
                </label>

                <input
                    value="${escapeHtml(dados.cliente)}"
                    oninput="dados.cliente=this.value">

            </div>


            <div class="field">

                <label>
                    Item
                </label>

                <input
                    value="${escapeHtml(dados.item)}"
                    oninput="dados.item=this.value">

            </div>


            <div class="field">

                <label>
                    Nº do lote
                </label>

                <input
                    value="${escapeHtml(dados.lote)}"
                    oninput="dados.lote=this.value">

            </div>


            <div class="field">

                <label>
                    Data de produção
                </label>

                <input
                    type="date"
                    value="${dados.data}"
                    onchange="dados.data=this.value">

            </div>


            <div class="field">

                <label>
                    Dimensão
                </label>

                <input
                    value="${escapeHtml(dados.dimensao)}"
                    oninput="dados.dimensao=this.value">

            </div>

        </div>

    </div>

    `;


    // --------------------------------------------------------
    // RESUMO
    // --------------------------------------------------------

    let totalLiquido = 0;

    let totalBruto = 0;

    let quantidadeItens = 0;


    pallets.forEach(p => {

        p.items.forEach(i => {

            const peso =
                parseFloat(
                    String(i.liquido).replace(",", ".")
                );

            if (!isNaN(peso)) {

                totalLiquido += peso;

            }

            quantidadeItens++;

        });


        const bruto =
            parseFloat(
                String(p.bruto).replace(",", ".")
            );

        if (!isNaN(bruto)) {

            totalBruto += bruto;

        }

    });


    html += `

    <div class="card">

        <div
            class="card-title"
            style="
                display:flex;
                justify-content:space-between;
            "
        >

            <span>
                Resumo
            </span>

            <span
                style="
                    background:#f1f3f5;
                    padding:6px 10px;
                    border-radius:20px;
                    font-size:12px;
                    font-weight:500;
                "
            >

                ${pallets.length}
                pallet${pallets.length !== 1 ? "s" : ""}

            </span>

        </div>


        <div class="summary-grid">


            <div class="summary-box">

                <div class="summary-label">
                    Peso líquido total
                </div>

                <div class="summary-value">

                    ${formatPeso(totalLiquido)}
                    kg

                </div>

            </div>


            <div class="summary-box">

                <div class="summary-label">
                    Peso bruto total
                </div>

                <div class="summary-value">

                    ${formatPeso(totalBruto)}
                    kg

                </div>

            </div>


            <div class="summary-box">

                <div class="summary-label">
                    Itens
                </div>

                <div class="summary-value">

                    ${quantidadeItens}

                </div>

            </div>


            <div class="summary-box">

                <div class="summary-label">
                    Pendências
                </div>

                <div class="summary-value">

                    ${calcularPendencias()}

                </div>

            </div>


        </div>

    </div>

    `;


    // --------------------------------------------------------
    // PALLETS
    // --------------------------------------------------------

    pallets.forEach((pallet, pi) => {

        html += `

        <div class="card">

            <div class="pallet-title">

                <h2>
                    Pallet ${pi + 1}
                </h2>


                ${
                    pallets.length > 1
                    ?
                    `
                    <button
                        class="remove-pallet"
                        onclick="removerPallet(${pi})">

                        Excluir pallet

                    </button>
                    `
                    :
                    ""
                }

            </div>


            <div class="help">

                Preencha o peso líquido de cada item.
                O peso bruto do pallet é opcional.

            </div>

        `;


        pallet.items.forEach((item, ii) => {

            const preenchido =
                item.liquido !== "" &&
                !isNaN(
                    parseFloat(
                        String(item.liquido)
                        .replace(",", ".")
                    )
                );


            html += `

            <div class="item">


                <div class="item-head">

                    <span class="item-name">

                        Item ${ii + 1}

                    </span>


                    <div
                        style="
                            display:flex;
                            gap:8px;
                            align-items:center;
                        "
                    >

                        <span class="item-status">

                            ${preenchido ? "✓ preenchido" : ""}

                        </span>


                        ${
                            pallet.items.length > 1
                            ?
                            `
                            <button
                                class="remove-item"
                                onclick="removerItem(${pi},${ii})">

                                Excluir item

                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                </div>


                <div class="item-fields">


                    <div class="field">

                        <label>
                            Número
                        </label>

                        <input
                            type="number"
                            value="${item.numero}"
                            onchange="
                                alterarNumero(
                                    ${pi},
                                    ${ii},
                                    this.value
                                )
                            "
                        >

                    </div>


                    <div class="field">

                        <label>
                            Peso líquido (kg)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            inputmode="decimal"
                            value="${item.liquido}"
                            oninput="
                                alterarLiquidoSemRender(
                                    ${pi},
                                    ${ii},
                                    this.value
                                )
                            "
                            onblur="
                                render()
                            "
                        >

                    </div>


                </div>

            </div>

            `;

        });


        if (pallet.items.length < 5) {

            html += `

                <button
                    class="add-item"
                    onclick="adicionarItem(${pi})">

                    + Adicionar item

                </button>

            `;

        }


        html += `

            <div class="bruto">

                <div class="bruto-title">

                    Peso Bruto do pallet (opcional)

                </div>


                <input
                    type="number"
                    step="0.01"
                    inputmode="decimal"
                    placeholder="Digite o peso bruto"
                    value="${pallet.bruto}"
                    oninput="
                        alterarBrutoSemRender(
                            ${pi},
                            this.value
                        )
                    "
                    onblur="render()"
                >

            </div>

        </div>

        `;

    });


    html += `
    </div>
    `;


    // --------------------------------------------------------
    // BOTÕES
    // --------------------------------------------------------

    html += `

    <div class="bottom">

        <button
            class="btn-light"
            onclick="adicionarPallet()">

            + Adicionar pallet

        </button>


        <button
            class="btn-dark"
            onclick="finalizar()">

            ✓ Finalizar romaneio

        </button>

    </div>

    `;


    document.getElementById("app").innerHTML = html;
}


// ------------------------------------------------------------
// ALTERAÇÕES SEM RENDER
// ------------------------------------------------------------

function alterarLiquidoSemRender(pi, ii, valor) {

    pallets[pi].items[ii].liquido = valor;

}


function alterarBrutoSemRender(pi, valor) {

    pallets[pi].bruto = valor;

}


function alterarNumero(pi, ii, valor) {

    pallets[pi].items[ii].numero = valor;

}


// ------------------------------------------------------------
// ADICIONAR ITEM
// ------------------------------------------------------------

function adicionarItem(pi) {

    if (pallets[pi].items.length >= 5) {

        alert(
            "Cada pallet pode ter no máximo 5 itens."
        );

        return;
    }


    pallets[pi].items.push({

        numero:
            pallets[pi].items.length + 1,

        liquido: ""

    });


    render();
}


// ------------------------------------------------------------
// REMOVER ITEM
// ------------------------------------------------------------

function removerItem(pi, ii) {

    if (pallets[pi].items.length <= 1) {

        alert(
            "O pallet precisa ter pelo menos 1 item."
        );

        return;
    }


    pallets[pi].items.splice(ii, 1);


    pallets[pi].items.forEach(
        (item, index) => {

            item.numero = index + 1;

        }
    );


    render();
}


// ------------------------------------------------------------
// ADICIONAR PALLET
// ------------------------------------------------------------

function adicionarPallet() {

    pallets.push({

        items: [
            {
                numero: 1,
                liquido: ""
            }
        ],

        bruto: ""

    });


    render();
}


// ------------------------------------------------------------
// REMOVER PALLET
// ------------------------------------------------------------

function removerPallet(pi) {

    if (pallets.length <= 1) {

        alert(
            "O romaneio precisa ter pelo menos 1 pallet."
        );

        return;
    }


    pallets.splice(pi, 1);

    render();
}


// ------------------------------------------------------------
// NOVO ROMANEIO
// ------------------------------------------------------------

function novoRomaneio() {

    const confirmar =
        confirm(
            "Deseja iniciar um novo romaneio? Os dados atuais serão apagados."
        );


    if (!confirmar) return;


    dados = {

        cliente: "",

        item: "",

        lote: "",

        data: dataHoje(),

        dimensao: ""

    };


    pallets = [

        {

            items: [

                {

                    numero: 1,

                    liquido: ""

                }

            ],

            bruto: ""

        }

    ];


    telaFinal = false;


    render();
}


// ------------------------------------------------------------
// FINALIZAR
// ------------------------------------------------------------

function finalizar() {

    const pendencias =
        calcularPendencias();


    if (pendencias > 0) {

        const continuar =
            confirm(
                "Existem " +
                pendencias +
                " item(ns) sem peso líquido. Deseja finalizar mesmo assim?"
            );


        if (!continuar) return;

    }


    telaFinal = true;

    render();
}


// ------------------------------------------------------------
// VOLTAR
// ------------------------------------------------------------

function voltar() {

    telaFinal = false;

    render();
}


// ------------------------------------------------------------
// COMPARTILHAR
// ------------------------------------------------------------

async function compartilhar() {

    if (navigator.share) {

        try {

            await navigator.share({

                title: "Romaneio Interno",

                text:
                    "Romaneio Interno\n" +
                    "Cliente: " +
                    (dados.cliente || "-") +
                    "\nItem: " +
                    (dados.item || "-") +
                    "\nLote: " +
                    (dados.lote || "-")

            });

        } catch (e) {

            console.log(e);

        }

    } else {

        alert(
            "O compartilhamento não está disponível neste navegador."
        );

    }

}


// ------------------------------------------------------------
// TELA FINAL
// ------------------------------------------------------------

function renderFinal() {

    let totalLiquido = 0;

    let totalBruto = 0;

    let totalItens = 0;


    pallets.forEach(p => {

        p.items.forEach(i => {

            const peso =
                parseFloat(
                    String(i.liquido)
                    .replace(",", ".")
                );


            if (!isNaN(peso)) {

                totalLiquido += peso;

            }


            totalItens++;

        });


        const bruto =
            parseFloat(
                String(p.bruto)
                .replace(",", ".")
            );


        if (!isNaN(bruto)) {

            totalBruto += bruto;

        }

    });


    const html = `

    <div class="final-page">


        <div
            class="final-card"
            id="romaneioImagem"
        >


            <div class="final-header">

                <div class="final-title">

                    ROMANEIO INTERNO

                </div>

            </div>


            <div class="final-grid">


                <div class="final-info">

                    <div class="final-label">
                        Cliente
                    </div>

                    <div class="final-value">

                        ${escapeHtml(dados.cliente) || "-"}

                    </div>

                </div>


                <div class="final-info">

                    <div class="final-label">
                        Item
                    </div>

                    <div class="final-value">

                        ${escapeHtml(dados.item) || "-"}

                    </div>

                </div>


                <div class="final-info">

                    <div class="final-label">
                        Nº do lote
                    </div>

                    <div class="final-value">

                        ${escapeHtml(dados.lote) || "-"}

                    </div>

                </div>


                <div class="final-info">

                    <div class="final-label">
                        Data de produção
                    </div>

                    <div class="final-value">

                        ${formatarData(dados.data) || "-"}

                    </div>

                </div>


                <div class="final-info">

                    <div class="final-label">
                        Dimensão
                    </div>

                    <div class="final-value">

                        ${escapeHtml(dados.dimensao) || "-"}

                    </div>

                </div>


                <div class="final-info">

                    <div class="final-label">
                        Pallets / Itens
                    </div>

                    <div class="final-value">

                        ${pallets.length}
                        pallet${pallets.length !== 1 ? "s" : ""}
                        /
                        ${totalItens}
                        itens

                    </div>

                </div>


            </div>


            <div class="final-line"></div>


            <div class="final-weight-grid">


                <div class="final-weight">

                    <div class="final-weight-label">

                        Somatória Peso Líquido

                    </div>


                    <div class="final-weight-value">

                        ${formatPeso(totalLiquido)}
                        kg

                    </div>

                </div>


                <div class="final-weight">

                    <div class="final-weight-label">

                        Somatória Peso Bruto

                    </div>


                    <div class="final-weight-value">

                        ${formatPeso(totalBruto)}
                        kg

                    </div>

                </div>


            </div>


            <div class="final-footer">

                Romaneio interno

            </div>


        </div>


        <div class="final-buttons">


            <button
                class="share"
                onclick="compartilhar()">

                ↗ Compartilhar

            </button>


            <button
                class="back"
                onclick="voltar()">

                ← Voltar e alterar

            </button>


            <button
                class="new"
                onclick="novoRomaneio()">

                + Novo romaneio

            </button>


        </div>


    </div>

    `;


    document.getElementById("app").innerHTML = html;

}


// ------------------------------------------------------------
// INICIA
// ------------------------------------------------------------

render();

</script>

</body>
