<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<title>ROMANEIO INTERNO</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html {
        background: #eef0f3;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #eef0f3;
        color: #07152f;
    }

    button,
    input {
        font-family: inherit;
    }

    .top-bar {
        width: 100%;
        background: #101827;
        color: white;
        padding: 22px 20px 18px;
        border-top: 5px solid #74789c;
    }

    .top-bar-inner {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
    }

    .top-title {
        font-size: 23px;
        font-weight: 900;
        letter-spacing: .2px;
        margin: 0;
    }

    .btn-new {
        border: 0;
        border-radius: 10px;
        background: #f1f3f6;
        color: #07152f;
        padding: 13px 18px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
    }

    .page {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 18px 15px 50px;
    }

    .card {
        background: white;
        border-radius: 17px;
        padding: 18px;
        margin-bottom: 15px;
        box-shadow: 0 2px 7px rgba(0,0,0,.07);
    }

    .card-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 18px;
    }

    .card-title h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 900;
        color: #07152f;
    }

    .section-title {
        font-size: 17px;
        font-weight: 900;
        margin: 0 0 14px;
        color: #07152f;
    }

    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .field {
        min-width: 0;
    }

    .field.full {
        grid-column: 1 / -1;
    }

    label {
        display: block;
        margin-bottom: 6px;
        color: #4d5c73;
        font-size: 13px;
        font-weight: 700;
    }

    input {
        width: 100%;
        height: 49px;
        border: 1px solid #ccd3dd;
        border-radius: 10px;
        padding: 0 12px;
        background: white;
        color: #07152f;
        font-size: 16px;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
    }

    input:focus {
        border-color: #6d7898;
        box-shadow: 0 0 0 2px rgba(109,120,152,.12);
    }

    input::placeholder {
        color: #8c96a5;
        opacity: 1;
    }

    .pallet {
        margin-top: 16px;
    }

    .pallet-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
    }

    .pallet-header h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 900;
    }

    .pallet-help {
        color: #607089;
        font-size: 12px;
        margin: 0 0 15px;
    }

    .btn {
        border: 0;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        font-size: 13px;
        padding: 11px 14px;
    }

    .btn-delete-pallet {
        background: #ffdede;
        color: #a90000;
    }

    .btn-delete-item {
        background: #ffe1e1;
        color: #a90000;
        padding: 7px 11px;
        font-size: 12px;
    }

    .item {
        border-top: 1px solid #e1e4e9;
        padding: 16px 0 14px;
    }

    .item:first-child {
        border-top: 0;
        padding-top: 0;
    }

    .item-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 9px;
    }

    .item-title {
        font-size: 15px;
        font-weight: 900;
        color: #07152f;
    }

    .item-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
    }

    .pending {
        font-size: 11px;
        color: #c84a00;
    }

    .complete {
        font-size: 11px;
        color: #187a3b;
    }

    .item-grid {
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        gap: 9px;
    }

    .item input {
        height: 48px;
    }

    .weight-input {
        color: #52647b;
    }

    .add-item-area {
        padding-top: 5px;
        border-top: 1px solid #e1e4e9;
        margin-top: 3px;
    }

    .btn-add-item {
        width: 100%;
        background: #e9edf3;
        color: #07152f;
        padding: 13px;
        font-size: 14px;
    }

    .gross-area {
        margin-top: 14px;
        border-top: 1px solid #e1e4e9;
        padding-top: 14px;
    }

    .gross-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
    }

    .optional {
        font-size: 12px;
        color: #607089;
        font-weight: 400;
    }

    .summary-card {
        background: #101827;
        color: white;
        border-radius: 17px;
        padding: 19px;
        margin-top: 16px;
        margin-bottom: 15px;
    }

    .summary-card h2 {
        margin: 0 0 17px;
        font-size: 19px;
    }

    .summary-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .summary-box {
        background: rgba(255,255,255,.08);
        border-radius: 11px;
        padding: 13px;
    }

    .summary-label {
        color: #c6ccda;
        font-size: 12px;
        margin-bottom: 6px;
    }

    .summary-value {
        font-size: 20px;
        font-weight: 900;
    }

    .summary-status {
        margin-top: 13px;
        color: #c6ccda;
        font-size: 12px;
    }

    .main-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .btn-main {
        width: 100%;
        height: 51px;
        border: 0;
        border-radius: 11px;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
    }

    .btn-finalize {
        background: #101827;
        color: white;
    }

    .btn-add-pallet {
        background: white;
        color: #07152f;
        border: 1px solid #ccd3dd;
    }

    .final-screen {
        display: none;
    }

    .final-card {
        background: white;
        border-radius: 17px;
        padding: 20px;
        box-shadow: 0 2px 7px rgba(0,0,0,.07);
    }

    .final-title {
        text-align: center;
        margin: 0 0 20px;
        font-size: 24px;
        font-weight: 900;
    }

    .final-info {
        border-top: 1px solid #e1e4e9;
        padding: 13px 0;
    }

    .final-info:first-of-type {
        border-top: 0;
    }

    .final-info-label {
        color: #607089;
        font-size: 12px;
        margin-bottom: 4px;
    }

    .final-info-value {
        font-size: 16px;
        font-weight: 700;
        word-break: break-word;
    }

    .final-pallet {
        margin-top: 16px;
        border: 1px solid #dde2e9;
        border-radius: 13px;
        padding: 14px;
    }

    .final-pallet h3 {
        margin: 0 0 12px;
        font-size: 17px;
    }

    .final-item {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        border-top: 1px solid #e8ebef;
        padding: 9px 0;
        font-size: 13px;
    }

    .final-item:first-of-type {
        border-top: 0;
    }

    .final-total {
        margin-top: 17px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .final-total-box {
        border-radius: 11px;
        background: #eef1f5;
        padding: 14px;
    }

    .final-total-label {
        font-size: 11px;
        color: #607089;
        margin-bottom: 5px;
    }

    .final-total-value {
        font-size: 19px;
        font-weight: 900;
    }

    .final-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 18px;
    }

    .btn-share {
        background: #101827;
        color: white;
    }

    .btn-back {
        background: #e9edf3;
        color: #07152f;
    }

    .btn-new-final {
        background: white;
        color: #07152f;
        border: 1px solid #ccd3dd;
    }

    .empty-message {
        text-align: center;
        color: #607089;
        padding: 15px 0;
    }

    @media (max-width: 650px) {
        .top-bar {
            padding-left: 15px;
            padding-right: 15px;
        }

        .top-title {
            font-size: 20px;
        }

        .page {
            padding: 12px 10px 40px;
        }

        .card {
            padding: 15px;
            border-radius: 15px;
        }

        .grid {
            grid-template-columns: 1fr;
        }

        .field.full {
            grid-column: auto;
        }

        .item-grid {
            grid-template-columns: 1fr 1.1fr;
        }

        .summary-grid,
        .final-total {
            grid-template-columns: 1fr 1fr;
        }
    }

    @media (max-width: 420px) {
        .top-title {
            font-size: 18px;
        }

        .btn-new {
            padding: 11px 13px;
        }

        .item-grid {
            grid-template-columns: 1fr 1.05fr;
        }

        input {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<header class="top-bar">
    <div class="top-bar-inner">
        <h1 class="top-title">ROMANEIO INTERNO</h1>

        <button class="btn-new" onclick="novoRomaneio()">
            + Novo
        </button>
    </div>
</header>


<!-- =========================
     TELA PRINCIPAL
========================= -->

<main id="main-screen" class="page">

    <section class="card">

        <h2 class="section-title">Informações do romaneio</h2>

        <div class="grid">

            <div class="field">
                <label for="cliente">Cliente</label>
                <input
                    id="cliente"
                    type="text"
                    autocomplete="off"
                    placeholder="Digite o cliente"
                    oninput="updateCliente(this.value)"
                >
            </div>

            <div class="field">
                <label for="item-geral">Item</label>
                <input
                    id="item-geral"
                    type="text"
                    autocomplete="off"
                    placeholder="Digite o item"
                    oninput="updateItemGeral(this.value)"
                >
            </div>

            <div class="field">
                <label for="lote">Nº do lote</label>
                <input
                    id="lote"
                    type="text"
                    autocomplete="off"
                    placeholder="Digite o lote"
                    oninput="updateLote(this.value)"
                >
            </div>

            <div class="field">
                <label for="data-producao">Data de produção</label>
                <input
                    id="data-producao"
                    type="date"
                    onchange="updateData(this.value)"
                >
            </div>

            <div class="field full">
                <label for="dimensao">Dimensão</label>
                <input
                    id="dimensao"
                    type="text"
                    autocomplete="off"
                    placeholder="Digite a dimensão"
                    oninput="updateDimensao(this.value)"
                >
            </div>

        </div>

    </section>


    <!-- PALLETS -->

    <div id="pallets-container"></div>


    <!-- RESUMO -->

    <section class="summary-card">

        <h2>Resumo</h2>

        <div class="summary-grid">

            <div class="summary-box">
                <div class="summary-label">
                    Peso Líquido Total
                </div>

                <div id="sum-liquid" class="summary-value">
                    0,00 kg
                </div>
            </div>

            <div class="summary-box">
                <div class="summary-label">
                    Peso Bruto Total
                </div>

                <div id="sum-gross" class="summary-value">
                    0,00 kg
                </div>
            </div>

        </div>

        <div id="summary-status" class="summary-status">
            5 itens cadastrados.
        </div>

    </section>


    <!-- AÇÕES -->

    <section class="main-actions">

        <button
            class="btn-main btn-add-pallet"
            onclick="addPallet()"
        >
            + Adicionar pallet
        </button>

        <button
            class="btn-main btn-finalize"
            onclick="finalizar()"
        >
            Finalizar romaneio
        </button>

    </section>

</main>


<!-- =========================
     TELA FINAL
========================= -->

<main id="final-screen" class="page final-screen">

    <section class="final-card">

        <h2 class="final-title">
            ROMANEIO INTERNO
        </h2>

        <div id="final-content"></div>

        <div class="final-total">

            <div class="final-total-box">
                <div class="final-total-label">
                    Peso Líquido Total
                </div>

                <div
                    id="final-liquid"
                    class="final-total-value"
                >
                    0,00 kg
                </div>
            </div>

            <div class="final-total-box">
                <div class="final-total-label">
                    Peso Bruto Total
                </div>

                <div
                    id="final-gross"
                    class="final-total-value"
                >
                    0,00 kg
                </div>
            </div>

        </div>


        <div class="final-actions">

            <button
                class="btn-main btn-share"
                onclick="compartilharImagem()"
            >
                Compartilhar imagem
            </button>

            <button
                class="btn-main btn-back"
                onclick="voltarAlterar()"
            >
                Voltar e alterar
            </button>

            <button
                class="btn-main btn-new-final"
                onclick="novoRomaneio()"
            >
                Novo romaneio
            </button>

        </div>

    </section>

</main>


<script>

/* ============================================================
   ESTADO INICIAL
============================================================ */

const QUANTIDADE_INICIAL_ITENS = 5;

let state = {
    cliente: "",
    itemGeral: "",
    lote: "",
    dataProducao: "",
    dimensao: "",

    pallets: [
        criarPallet(1)
    ]
};

let imagemRomaneioPronta = null;


/* ============================================================
   CRIAÇÃO DE PALLET
============================================================ */

function criarPallet(numero) {

    return {
        numero: numero,

        items: Array.from(
            { length: QUANTIDADE_INICIAL_ITENS },
            (_, index) => ({
                numero: index + 1,
                liquido: ""
            })
        ),

        bruto: ""
    };
}


/* ============================================================
   FORMATAÇÃO DE PESO
============================================================ */

function parsePeso(valor) {

    if (valor === null || valor === undefined) {
        return 0;
    }

    let texto = String(valor)
        .trim()
        .replace(/\s/g, "");

    if (!texto) {
        return 0;
    }

    /*
       Permite:

       10
       10,5
       10.5
       1.234,56
       1,234.56
    */

    if (texto.includes(",") && texto.includes(".")) {

        if (texto.lastIndexOf(",") > texto.lastIndexOf(".")) {

            texto = texto
                .replace(/\./g, "")
                .replace(",", ".");

        } else {

            texto = texto
                .replace(/,/g, "");

        }

    } else if (texto.includes(",")) {

        texto = texto.replace(",", ".");

    }

    const numero = parseFloat(texto);

    return Number.isFinite(numero) ? numero : 0;
}


function formatarPeso(valor) {

    const numero = Number(valor) || 0;

    return numero.toLocaleString("pt-BR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


/* ============================================================
   SALVAR
============================================================ */

function saveState() {

    try {
        localStorage.setItem(
            "romaneioInterno",
            JSON.stringify(state)
        );
    } catch (e) {
        console.log("Não foi possível salvar:", e);
    }
}


/* ============================================================
   CARREGAR
============================================================ */

function loadState() {

    try {

        const salvo = localStorage.getItem(
            "romaneioInterno"
        );

        if (!salvo) {
            return;
        }

        const dados = JSON.parse(salvo);

        if (!dados || !Array.isArray(dados.pallets)) {
            return;
        }

        state = dados;

        if (!state.pallets.length) {
            state.pallets.push(criarPallet(1));
        }

        /*
           Garante que pallets antigos tenham
           a estrutura correta.
        */

        state.pallets.forEach((pallet, palletIndex) => {

            if (!Array.isArray(pallet.items)) {
                pallet.items = [];
            }

            if (!pallet.items.length) {

                pallet.items.push({
                    numero: 1,
                    liquido: ""
                });
            }

            pallet.numero = palletIndex + 1;

            pallet.items.forEach((item, itemIndex) => {

                item.numero = itemIndex + 1;

                if (
                    item.liquido === undefined ||
                    item.liquido === null
                ) {
                    item.liquido = "";
                }

            });

            if (
                pallet.bruto === undefined ||
                pallet.bruto === null
            ) {
                pallet.bruto = "";
            }

        });

    } catch (e) {

        console.log(
            "Não foi possível carregar os dados:",
            e
        );

    }
}


/* ============================================================
   ATUALIZAÇÕES DOS CAMPOS PRINCIPAIS
============================================================ */

function updateCliente(valor) {

    state.cliente = valor;
    saveState();
}


function updateItemGeral(valor) {

    state.itemGeral = valor;
    saveState();
}


function updateLote(valor) {

    state.lote = valor;
    saveState();
}


function updateData(valor) {

    state.dataProducao = valor;
    saveState();
}


function updateDimensao(valor) {

    state.dimensao = valor;
    saveState();
}


/* ============================================================
   PESO LÍQUIDO
   IMPORTANTE:
   NÃO chama render() aqui.
   Isso impede o teclado do iPhone de fechar.
============================================================ */

function updateLiquidInput(
    palletIndex,
    itemIndex,
    valor
) {

    state.pallets[palletIndex]
        .items[itemIndex]
        .liquido = valor;

    saveState();

    refreshSummary();

    atualizarStatusItem(
        palletIndex,
        itemIndex
    );
}


/* ============================================================
   PESO BRUTO
   Também não reconstrói o DOM.
============================================================ */

function updateBrutoInput(
    palletIndex,
    valor
) {

    state.pallets[palletIndex].bruto = valor;

    saveState();

    refreshSummary();
}


/* ============================================================
   STATUS DO ITEM
============================================================ */

function atualizarStatusItem(
    palletIndex,
    itemIndex
) {

    const item =
        state.pallets[palletIndex]
            .items[itemIndex];

    const elemento = document.getElementById(
        `status-${palletIndex}-${itemIndex}`
    );

    if (!elemento) {
        return;
    }

    if (String(item.liquido).trim() !== "") {

        elemento.textContent = "Preenchido";
        elemento.className = "complete";

    } else {

        elemento.textContent = "Pendente";
        elemento.className = "pending";
    }
}


/* ============================================================
   ADICIONAR ITEM
============================================================ */

function addItem(palletIndex) {

    const pallet = state.pallets[palletIndex];

    pallet.items.push({
        numero: pallet.items.length + 1,
        liquido: ""
    });

    saveState();

    render();
}


/* ============================================================
   EXCLUIR ITEM
============================================================ */

function removeItem(
    palletIndex,
    itemIndex
) {

    const pallet = state.pallets[palletIndex];

    /*
       Mantemos pelo menos 1 item no pallet.
    */

    if (pallet.items.length <= 1) {

        alert(
            "Cada pallet precisa ter pelo menos 1 item."
        );

        return;
    }

    pallet.items.splice(itemIndex, 1);

    /*
       Renumera os itens.
    */

    pallet.items.forEach(
        (item, index) => {
            item.numero = index + 1;
        }
    );

    saveState();

    render();
}


/* ============================================================
   ADICIONAR PALLET
============================================================ */

function addPallet() {

    state.pallets.push(
        criarPallet(
            state.pallets.length + 1
        )
    );

    saveState();

    render();

    setTimeout(() => {

        const pallets =
            document.querySelectorAll(".pallet");

        if (pallets.length) {

            pallets[pallets.length - 1]
                .scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
        }

    }, 100);
}


/* ============================================================
   EXCLUIR PALLET
============================================================ */

function removePallet(palletIndex) {

    if (state.pallets.length <= 1) {

        alert(
            "O romaneio precisa ter pelo menos 1 pallet."
        );

        return;
    }

    const confirmar = confirm(
        `Deseja excluir o Pallet ${palletIndex + 1}?`
    );

    if (!confirmar) {
        return;
    }

    state.pallets.splice(
        palletIndex,
        1
    );

    state.pallets.forEach(
        (pallet, index) => {
            pallet.numero = index + 1;
        }
    );

    saveState();

    render();
}


/* ============================================================
   RESUMO
============================================================ */

function calcularTotais() {

    let liquido = 0;
    let bruto = 0;

    let totalItens = 0;
    let pendentes = 0;

    state.pallets.forEach(
        pallet => {

            pallet.items.forEach(
                item => {

                    totalItens++;

                    if (
                        String(item.liquido)
                            .trim() === ""
                    ) {

                        pendentes++;

                    }

                    liquido += parsePeso(
                        item.liquido
                    );
                }
            );

            bruto += parsePeso(
                pallet.bruto
            );
        }
    );

    return {
        liquido,
        bruto,
        totalItens,
        pendentes
    };
}


/* ============================================================
   ATUALIZA APENAS O RESUMO
   Não mexe nos inputs.
============================================================ */

function refreshSummary() {

    const totais = calcularTotais();

    const liquid =
        document.getElementById(
            "sum-liquid"
        );

    const gross =
        document.getElementById(
            "sum-gross"
        );

    const status =
        document.getElementById(
            "summary-status"
        );

    if (liquid) {

        liquid.textContent =
            `${formatarPeso(totais.liquido)} kg`;
    }

    if (gross) {

        gross.textContent =
            `${formatarPeso(totais.bruto)} kg`;
    }

    if (status) {

        if (totais.pendentes === 0) {

            status.textContent =
                `${totais.totalItens} itens cadastrados. Todos os pesos líquidos foram preenchidos.`;

        } else {

            status.textContent =
                `${totais.totalItens} itens cadastrados. ${totais.pendentes} peso(s) líquido(s) pendente(s).`;
        }
    }
}


/* ============================================================
   RENDERIZAÇÃO DOS PALLETS
============================================================ */

function render() {

    const container =

            "pallets-container"
        );

    container.innerHTML = "";

    state.pallets.forEach(
        (pallet, palletIndex) => {

            const palletElement =
                document.createElement("section");

            palletElement.className =
                "card pallet";

            let itemsHTML = "";

            pallet.items.forEach(
                (item, itemIndex) => {

                    const preenchido =
                        String(item.liquido)
                            .trim() !== "";

                    itemsHTML += `

                        <div class="item">

                            <div class="item-header">

                                <div class="item-title">
                                    Item ${itemIndex + 1}
                                </div>

                                <div class="item-actions">

                                    <span
                                        id="status-${palletIndex}-${itemIndex}"
                                        class="${
                                            preenchido
                                                ? "complete"
                                                : "pending"
                                        }"
                                    >
                                        ${
                                            preenchido
                                                ? "Preenchido"
                                                : "Pendente"
                                        }
                                    </span>

                                    <button
                                        type="button"
                                        class="btn btn-delete-item"
                                        onclick="removeItem(
                                            ${palletIndex},
                                            ${itemIndex}
                                        )"
                                    >
                                        Excluir item
                                    </button>

                                </div>

                            </div>


                            <div class="item-grid">

                                <div class="field">

                                    <label>
                                        Número
                                    </label>

                                    <input
                                        type="text"
                                        inputmode="numeric"
                                        value="${escapeHTML(
                                            item.numero
                                        )}"
                                        autocomplete="off"
                                        onchange="
                                            updateItemNumero(
                                                ${palletIndex},
                                                ${itemIndex},
                                                this.value
                                            )
                                        "
                                    >

                                </div>


                                <div class="field">

                                    <label>
                                        Peso líquido (kg)
                                    </label>

                                    <input
                                        class="weight-input"
                                        type="text"
                                        inputmode="decimal"
                                        value="${escapeHTML(
                                            item.liquido
                                        )}"
                                        placeholder="0,00"
                                        autocomplete="off"
                                        oninput="
                                            updateLiquidInput(
                                                ${palletIndex},
                                                ${itemIndex},
                                                this.value
                                            )
                                        "
                                    >

                                </div>

                            </div>

                        </div>

                    `;
                }
            );


            palletElement.innerHTML = `

                <div class="pallet-header">

                    <h2>
                        Pallet ${palletIndex + 1}
                    </h2>

                    <button
                        type="button"
                        class="btn btn-delete-pallet"
                        onclick="removePallet(
                            ${palletIndex}
                        )"
                    >
                        Excluir pallet
                    </button>

                </div>


                <p class="pallet-help">
                    Preencha o peso líquido de cada item.
                    O peso bruto do pallet é opcional.
                </p>


                ${itemsHTML}


                <!--
                    IMPORTANTE:
                    ESTE BOTÃO NÃO TEM MAIS LIMITE DE 5.
                    Os 5 itens são apenas a quantidade inicial.
                -->

                <div class="add-item-area">

                    <button
                        type="button"
                        class="btn btn-add-item"
                        onclick="addItem(
                            ${palletIndex}
                        )"
                    >
                        + Adicionar item
                    </button>

                </div>


                <div class="gross-area">

                    <div class="gross-label">

                        <label
                            for="bruto-${palletIndex}"
                        >
                            Peso Bruto do pallet
                        </label>

                        <span class="optional">
                            (opcional)
                        </span>

                    </div>

                    <input
                        id="bruto-${palletIndex}"
                        class="weight-input"
                        type="text"
                        inputmode="decimal"
                        value="${escapeHTML(
                            pallet.bruto
                        )}"
                        placeholder="0,00"
                        autocomplete="off"
                        oninput="
                            updateBrutoInput(
                                ${palletIndex},
                                this.value

            `;

                palletElement

    /*
       Atualiza os campos principais
       somente quando renderizamos de verdade.
    */

    const cliente =
        document.getElementById("cliente");

    const itemGeral =
        document.getElementById("item-geral");

    const lote =
        document.getElementById("lote");

    const data =
        document.getElementById("data-producao");

    const dimensao =
        document.getElementById("dimensao");


    if (cliente) {
        cliente.value =
            state.cliente || "";
    }

    if (itemGeral) {
        itemGeral.value =
            state.itemGeral || "";
    }

    if (lote) {
        lote.value =
            state.lote || "";
    }

    if (data) {
        data.value =
            state.dataProducao || "";
    }

    if (dimensao) {
        dimensao.value =
            state.dimensao || "";
    }


    refreshSummary();
}


/* ============================================================
   NÚMERO DO ITEM
============================================================ */

function updateItemNumero(
    palletIndex,
    itemIndex,
    valor
) {

    state.pallets[palletIndex]
        .items[itemIndex]
        .numero = valor;

    saveState();
}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {
        return "";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ============================================================
   VALIDAÇÃO
============================================================ */

function validarRomaneio() {

    const erros = [];


    if (!String(state.cliente).trim()) {

        erros.push(
            "Preencha o Cliente."
        );
    }


    if (!String(state.itemGeral).trim()) {

        erros.push(
            "Preencha o Item."
        );
    }


    if (!String(state.lote).trim()) {

        erros.push(
            "Preencha o Nº do lote."
        );
    }


    if (!String(state.dataProducao).trim()) {

        erros.push(
            "Preencha a Data de produção."
        );
    }


    if (!String(state.dimensao).trim()) {

        erros.push(
            "Preencha a Dimensão."
        );
    }


    state.pallets.forEach(
        (pallet, palletIndex) => {

            pallet.items.forEach(
                (item, itemIndex) => {

                    if (
                        String(item.liquido)
                            .trim() === ""
                    ) {

                        erros.push(
                            `Preencha o peso líquido do Pallet ${
                                palletIndex + 1
                            }, Item ${
                                itemIndex + 1
                            }.`
                        );
                    }
                }
            );
        }
    );


    return erros;
}


/* ============================================================
   FORMATA DATA
============================================================ */

function formatarData(data) {

    if (!data) {
        return "";
    }

    const partes =
        data.split("-");

    if (partes.length !== 3) {
        return data;
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}


/* ============================================================
   FINALIZAR
============================================================ */

function finalizar() {

    const erros =
        validarRomaneio();

    if (erros.length) {

        alert(
            erros.join("\n")
        );

        return;
    }


    const totais =
        calcularTotais();


    document.getElementById(
        "final-liquid"
    ).textContent =
        `${formatarPeso(totais.liquido)} kg`;


    document.getElementById(
        "final-gross"
    ).textContent =
        `${formatarPeso(totais.bruto)} kg`;


    montarTelaFinal();


    document.getElementById(
        "main-screen"
    ).style.display = "none";


    document.getElementById(
        "final-screen"
    ).style.display = "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    /*
       Prepara a imagem ANTES do clique
       no botão Compartilhar.
       Isso é importante para o iPhone.
    */

    prepararImagemRomaneio();
}

   VOLTAR E ALTERAR
============================================================ */

function voltarAlterar() {

        "final-screen"
    ).style.display = "none";

        "main-screen"
    ).style.display = "block";


    render();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ============================================================
   NOVO ROMANEIO
============================================================ */

function novoRomaneio() {

    const temDados =
        state.cliente ||
        state.itemGeral ||
        state.lote ||
        state.dataProducao ||
        state.dimensao ||
        state.pallets.some(
            pallet =>
                pallet.items.some(
                    item =>
                        String(
                            item.liquido
                        ).trim() !== ""
                ) ||
                String(
                    pallet.bruto
                ).trim() !== ""
        );


    if (temDados) {

        const confirmar =
            confirm(
                "Deseja iniciar um novo romaneio? Os dados atuais serão apagados."
            );

        if (!confirmar) {
            return;
        }
    }


    state = {
        cliente: "",
        itemGeral: "",
        lote: "",
        dataProducao: "",
        dimensao: "",

        pallets: [
            criarPallet(1)
        ]
    };


    imagemRomaneioPronta = null;


    localStorage.removeItem(
        "romaneioInterno"
    );


    document.getElementById(
        "final-screen"
    ).style.display = "none";


    document.getElementById(
        "main-screen"
    ).style.display = "block";


    render();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ============================================================
   DESENHO DA IMAGEM
============================================================ */

/*
   A imagem é criada diretamente em Canvas.
   Não depende de SVG externo, imagem ou logo.
*/

function criarCanvasRomaneio() {

    const largura = 1000;

    let altura = 700;

    const linhasPorPallet =
        state.pallets.reduce(
            (total, pallet) =>
                total +
                110 +
                pallet.items.length * 48,
            0
        );

    altura += linhasPorPallet;


    const canvas =
        document.createElement("canvas");

    canvas.width = largura;
    canvas.height = altura;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        0,
        0,
        largura,
        altura
    );


    let y = 60;


    /*
       Cabeçalho
    */

    ctx.fillStyle = "#101827";

    ctx.fillRect(
        0,
        0,
        largura,
        100
    );


    ctx.fillStyle = "#ffffff";

    ctx.font =
        "900 32px Arial";

    ctx.fillText(
        "ROMANEIO INTERNO",
        55,
        62
    );


    /*
       Informações
    */

    y = 145;

    ctx.fillStyle = "#07152f";

    ctx.font =
        "700 20px Arial";

    ctx.fillText(
        `Cliente: ${state.cliente || "-"}`,
        55,
        y
    );

    y += 40;

    ctx.fillText(
        `Item: ${state.itemGeral || "-"}`,
        55,
        y
    );

    y += 40;

    ctx.fillText(
        `Nº do lote: ${state.lote || "-"}`,
        55,
        y
    );

    y += 40;

    ctx.fillText(
        `Data de produção: ${
            formatarData(
                state.dataProducao
            ) || "-"
        }`,
        55,
        y
    );

    y += 40;

    ctx.fillText(
        `Dimensão: ${state.dimensao || "-"}`,
        55,
        y
    );


    /*
       Pallets
    */

    y += 65;


    state.pallets.forEach(
        (pallet, palletIndex) => {

            ctx.fillStyle = "#101827";

            ctx.fillRect(
                45,
                y - 28,
                910,
                48
            );


            ctx.fillStyle = "#ffffff";

            ctx.font =
                "900 21px Arial";

            ctx.fillText(
                `Pallet ${palletIndex + 1}`,
                65,
                y + 4
            );


            y += 55;


            ctx.fillStyle = "#07152f";

            ctx.font =
                "700 16px Arial";

            ctx.fillText(
                "Item",
                65,
                y
            );

            ctx.fillText(
                "Número",
                300,
                y
            );

            ctx.fillText(
                "Peso líquido",
                700,
                y
            );


            y += 30;


            pallet.items.forEach(
                (item, itemIndex) => {

                    ctx.font =
                        "400 16px Arial";

                    ctx.fillText(
                        `Item ${itemIndex + 1}`,
                        65,
                        y
                    );

                    ctx.fillText(
                        `${item.numero}`,
                        300,
                        y
                    );

                    ctx.fillText(
                        `${formatarPeso(
                            parsePeso(
                                item.liquido
                            )
                        )} kg`,
                        700,
                        y
                    );


                    ctx.strokeStyle =
                        "#e0e4e9";

                    ctx.beginPath();

                    ctx.moveTo(
                        55,
                        y + 15
                    );

                    ctx.lineTo(
                        945,
                        y + 15
                    );

                    ctx.stroke();


                    y += 48;
                }
            );


            ctx.font =
                "700 16px Arial";

            ctx.fillStyle =
                "#52647b";

            ctx.fillText(
                `Peso Bruto do pallet: ${
                    String(
                        pallet.bruto
                    ).trim()
                        ? formatarPeso(
                            parsePeso(
                                pallet.bruto
                            )
                        ) + " kg"
                        : "Não informado"
                }`,
                65,
                y + 5
            );


            y += 65;
        }
    );


    /*
       Totais
    */

    const totais =
        calcularTotais();


    ctx.fillStyle = "#eef1f5";

    ctx.fillRect(
        45,
        y,
        910,
        100
    );


    ctx.fillStyle = "#07152f";

    ctx.font =
        "900 19px Arial";

    ctx.fillText(
        "Peso Líquido Total",
        75,
        y + 40
    );

    ctx.fillText(
        "Peso Bruto Total",
        555,
        y + 40
    );


    ctx.font =
        "900 24px Arial";

    ctx.fillText(
        `${formatarPeso(
            totais.liquido
        )} kg`,
        75,
        y + 72
    );

    ctx.fillText(
        `${formatarPeso(
            totais.bruto
        )} kg`,
        555,
        y + 72
    );


    return canvas;
}


/* ============================================================
   PREPARAR IMAGEM
============================================================ */

function prepararImagemRomaneio() {

    try {

        const canvas =
            criarCanvasRomaneio();


        /*
           toDataURL é síncrono.
           Isso ajuda a manter o arquivo pronto
           para o gesto do botão no iPhone.
        */

        const dataURL =
            canvas.toDataURL(
                "image/png"
            );


        const partes =
            dataURL.split(",");


        const mime =
            partes[0]
                .match(/:(.*?);/)[1];


        const binario =
            atob(partes[1]);


        const tamanho =
            binario.length;


        const array =
            new Uint8Array(tamanho);


        for (
            let i = 0;
            i < tamanho;
            i++
        ) {

            array[i] =
                binario.charCodeAt(i);
        }


        const blob =
            new Blob(
                [array],
                { type: mime }
            );


        imagemRomaneioPronta =
            new File(
                [blob],
                "romaneio-interno.png",
                {
                    type: "image/png"
                }
            );

    } catch (erro) {

        console.error(
            "Erro ao preparar imagem:",
            erro
        );

        imagemRomaneioPronta = null;
    }
}


/* ============================================================
   COMPARTILHAR IMAGEM
============================================================ */

function compartilharImagem() {

    /*
       Se por algum motivo a imagem não tiver
       sido preparada, tentamos preparar agora.
    */

    if (!imagemRomaneioPronta) {

        prepararImagemRomaneio();
    }


    if (!imagemRomaneioPronta) {

        alert(
            "Não foi possível preparar a imagem do romaneio."
        );

        return;
    }


    const arquivo =
        imagemRomaneioPronta;


    /*
       iPhone / navegadores que aceitam
       compartilhamento de arquivos.
    */

    if (
        navigator.share &&
        navigator.canShare
    ) {

        try {

            const podeCompartilhar =
                navigator.canShare({
                    files: [arquivo]
                });


            if (podeCompartilhar) {

                /*
                   IMPORTANTE:
                   Não usamos await antes do navigator.share.
                   O compartilhamento acontece diretamente
                   no clique do botão.
                */

                navigator.share({
                    title: "Romaneio Interno",
                    text: "Romaneio Interno",
                    files: [arquivo]
                })
                .catch(
                    erro => {

                        /*
                           Cancelamento pelo usuário
                           não precisa gerar alerta.
                        */

                        if (
                            erro &&
                            erro.name !==
                                "AbortError"
                        ) {

                            abrirImagemFallback(
                                arquivo
                            );
                        }
                    }
                );

                return;
            }

        } catch (erro) {

            console.log(
                "Compartilhamento de arquivo não disponível:",
                erro
            );
        }
    }


    /*
       Fallback para navegadores que não aceitam
       navigator.share com arquivos.
    */

    abrirImagemFallback(
        arquivo
    );
}


/* ============================================================
   FALLBACK DA IMAGEM
============================================================ */

function abrirImagemFallback(
    arquivo
) {

    const url =
        URL.createObjectURL(
            arquivo
        );


    /*
       Tenta abrir a imagem em uma nova aba.
    */

    const novaAba =
        window.open(
            url,
            "_blank"
        );


    /*
       Se o navegador bloquear nova aba,
       oferece download.
    */

    if (!novaAba) {

        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            "romaneio-interno.png";

        document.body.appendChild(
            link
        );

        link.click();

        link.remove();
    }


    setTimeout(
        () => {
            URL.revokeObjectURL(url);
        },
        60000
    );
}


/* ============================================================
   INICIALIZAÇÃO
============================================================ */

loadState();

render();

</script>
