<!doctype html>
<html lang="pt-BR" translate="no">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<meta name="theme-color"
      content="#111827">

<title>ROMANEIO INTERNO</title>

<style>

:root{
    --bg:#f3f4f6;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --primary:#111827;
    --ok:#166534;
    --danger-bg:#fee2e2;
    --danger:#991b1b;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
}

header{
    background:var(--primary);
    color:white;
    padding:16px;
    position:sticky;
    top:0;
    z-index:20;
}

.header-inner{
    max-width:720px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

h1{
    margin:0;
    font-size:21px;
    font-weight:900;
}

main{
    max-width:720px;
    margin:auto;
    padding:14px 12px 110px;
}

.card{
    background:white;
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 2px 8px #00000008;
}

label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:6px;
}

input{
    width:100%;
    height:48px;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:0 12px;
    font-size:16px;
    background:white;
    color:#111827;
}

input:focus{
    outline:2px solid #9ca3af;
    border-color:#6b7280;
}

button{
    border:0;
    border-radius:11px;
    padding:12px 14px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    touch-action:manipulation;
}

.primary{
    background:#111827;
    color:white;
}

.secondary{
    background:#eef0f2;
    color:#111827;
}

.danger{
    background:var(--danger-bg);
    color:var(--danger);
}

.full{
    width:100%;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.info-grid .wide{
    grid-column:1/-1;
}

.pallet-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.pallet-title{
    font-size:18px;
    font-weight:900;
}

.badge{
    font-size:12px;
    padding:5px 9px;
    border-radius:999px;
    background:#f3f4f6;
    color:var(--muted);
}

.item{
    border-top:1px solid var(--line);
    padding:13px 0;
}

.item:first-child{
    border-top:0;
    padding-top:0;
}

.item-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
}

.item-num{
    font-size:14px;
    font-weight:800;
}

.item-status{
    font-size:11px;
    color:#b45309;
}

.item-status.ok{
    color:var(--ok);
}

.actions{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
}

.row{
    display:grid;
    grid-template-columns:1fr 1.3fr;
    gap:8px;
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.stat{
    background:#f9fafb;
    border-radius:12px;
    padding:12px;
}

.stat span{
    display:block;
    font-size:12px;
    color:var(--muted);
}

.stat b{
    display:block;
    font-size:20px;
    margin-top:4px;
}

.small{
    font-size:12px;
    line-height:1.4;
    color:var(--muted);
}

.pallet-bruto{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
}

.pallet-bruto label{
    display:flex;
    justify-content:space-between;
}

.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:white;
    border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    z-index:30;
}

.bottom-inner{
    max-width:720px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.final-card{
    display:none;
    background:white;
    border:2px solid #111827;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
}

.final-title{
    text-align:center;
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:18px;
}

.final-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:14px;
}

.final-field{
    background:#f9fafb;
    border-radius:10px;
    padding:11px;
}

.final-field span{
    display:block;
    font-size:11px;
    color:var(--muted);
    font-weight:700;
    margin-bottom:4px;
}

.final-field b{
    font-size:14px;
    word-break:break-word;
}

.weight-total{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.weight-box{
    background:#f3f4f6;
    border-radius:13px;
    padding:18px 10px;
    text-align:center;
}

.weight-box span{
    display:block;
    font-size:12px;
    color:var(--muted);
    font-weight:700;
}

.weight-box b{
    display:block;
    font-size:24px;
    margin-top:7px;
}

.final-actions{
    display:none;
    gap:8px;
    margin-top:12px;
}

.final-actions button{
    flex:1;
}

body.final-mode header{
    display:none;
}

body.final-mode .editor-only{
    display:none !important;
}

body.final-mode .bottom{
    display:none !important;
}

body.final-mode .final-card{
    display:block;
}

body.final-mode .final-actions{
    display:flex;
    flex-wrap:wrap;
}

body.final-mode main{
    max-width:720px;
    padding-bottom:30px;
}

.share-note{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    margin-top:8px;
}

@media(max-width:480px){

    h1{
        font-size:18px;
    }

    .info-grid{
        grid-template-columns:1fr 1fr;
    }

    .row{
        grid-template-columns:1fr 1.3fr;
    }

    .final-info{
        grid-template-columns:1fr 1fr;
    }

    .final-actions button{
        font-size:12px;
        padding:11px 8px;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-inner">

        <h1>
            ROMANEIO INTERNO
        </h1>

        <button
            class="secondary"
            onclick="novoRomaneio()">

            ＋ Novo

        </button>

    </div>

</header>


<main id="app"></main>


<div class="bottom">

    <div class="bottom-inner">

        <button
            class="secondary"
            onclick="addPallet()">

            ＋ Adicionar pallet

        </button>

        <button
            class="primary"
            onclick="finalizar()">

            ✓ Finalizar romaneio

        </button>

    </div>

</div>


<script>

/* ==========================================================
   CONFIGURAÇÃO
========================================================== */

const KEY =
    "romaneio_mobile_v2";


/* ==========================================================
   ESTADO INICIAL
========================================================== */

function criarItensIniciais(){

    return Array.from(
        {length:5},
        (_,i)=>({

            numero:i+1,

            p1:""

        })
    );

}


function criarPallet(){

    return {

        id:Date.now()+Math.random(),

        items:criarItensIniciais(),

        bruto:""

    };

}


/* ==========================================================
   CARREGAMENTO
========================================================== */

let state =
    JSON.parse(
        localStorage.getItem(KEY) || "null"
    );


if(!state){

    state={

        info:{

            cliente:"",
            item:"",
            lote:"",
            data:"",
            dimensao:""

        },

        pallets:[
            criarPallet()
        ]

    };

}


/* ==========================================================
   GARANTE ESTRUTURA
========================================================== */

if(!state.info){

    state.info={

        cliente:"",
        item:"",
        lote:"",
        data:"",
        dimensao:""

    };

}


if(!Array.isArray(state.pallets) ||
   state.pallets.length===0){

    state.pallets=[
        criarPallet()
    ];

}


/* ==========================================================
   MIGRAÇÃO:
   SE O PALLET ANTIGO TIVER APENAS 1 ITEM,
   COMPLETA ATÉ 5.
========================================================== */

state.pallets.forEach(pallet=>{

    if(!Array.isArray(pallet.items)){

        pallet.items=[];

    }

    while(
        pallet.items.length < 5
    ){

        pallet.items.push({

            numero:
                pallet.items.length+1,

            p1:""

        });

    }

    pallet.items.forEach(
        (item,index)=>{

            if(item.numero===undefined){

                item.numero=index+1;

            }

            if(item.p1===undefined){

                item.p1="";

            }

        }
    );

    if(pallet.bruto===undefined){

        pallet.bruto="";

    }

});


save();


/* ==========================================================
   SALVAR
========================================================== */

function save(){

    localStorage.setItem(
        KEY,
        JSON.stringify(state)
    );

}


/* ==========================================================
   NÚMERO
========================================================== */

function num(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;

    }

    const n =
        parseFloat(
            String(valor)
                .replace(",",".")
        );

    return Number.isFinite(n)
        ? n
        : 0;

}


/* ==========================================================
   FORMATAÇÃO
========================================================== */

function fmt(valor){

    return new Intl.NumberFormat(
        "pt-BR",
        {
            maximumFractionDigits:2
        }
    ).format(valor);

}


/* ==========================================================
   TOTAIS
========================================================== */

function totals(){

    let p1=0;

    let items=0;

    let pending=0;


    state.pallets.forEach(
        pallet=>{

            pallet.items.forEach(
                item=>{

                    items++;

                    p1 += num(item.p1);

                    if(
                        item.p1 === "" ||
                        item.p1 === null ||
                        item.p1 === undefined
                    ){

                        pending++;

                    }

                }
            );

        }
    );


    return {

        p1,
        items,
        pending

    };

}


/* ==========================================================
   RENDER
========================================================== */

function render(){

    const app =
        document.getElementById("app");


    app.innerHTML="";


    /* ======================================================
       DADOS
    ====================================================== */

    const infoCard =
        document.createElement("div");


    infoCard.className =
        "card editor-only";


    infoCard.innerHTML=`

        <div class="pallet-head">

            <div class="pallet-title">
                Dados do Romaneio
            </div>

        </div>


        <div class="info-grid">

            <div class="wide">

                <label>
                    Cliente
                </label>

                <input
                    value="${esc(state.info.cliente)}"
                    onchange="
                        updateInfo(
                            'cliente',
                            this.value
                        )
                    "
                    placeholder="Digite o cliente">

            </div>


            <div>

                <label>
                    Item
                </label>

                <input
                    value="${esc(state.info.item)}"
                    onchange="
                        updateInfo(
                            'item',
                            this.value
                        )
                    "
                    placeholder="Item">

            </div>


            <div>

                <label>
                    Nº do lote
                </label>

                <input
                    value="${esc(state.info.lote)}"
                    onchange="
                        updateInfo(
                            'lote',
                            this.value
                        )
                    "
                    placeholder="Lote">

            </div>


            <div>

                <label>
                    Data de produção
                </label>

                <input
                    type="date"
                    value="${state.info.data}"
                    onchange="
                        updateInfo(
                            'data',
                            this.value
                        )
                    ">

            </div>


            <div>

                <label>
                    Dimensão
                </label>

                <input
                    value="${esc(state.info.dimensao)}"
                    onchange="
                        updateInfo(
                            'dimensao',
                            this.value
                        )
                    "
                    placeholder="Ex.: 100 x 200 mm">

            </div>

        </div>

    `;


    app.appendChild(infoCard);


    /* ======================================================
       RESUMO
    ====================================================== */

    const t=totals();


    const brutoTotal =
        state.pallets.reduce(
            (s,p)=>
                s + num(p.bruto),
            0
        );


    const resumo =
        document.createElement("div");


    resumo.className =
        "card editor-only";


    resumo.innerHTML=`

        <div class="pallet-head">

            <div class="pallet-title">
                Resumo
            </div>

            <div class="badge">

                ${state.pallets.length}

                pallet
                ${state.pallets.length===1?"":"s"}

            </div>

        </div>


        <div class="summary">

            <div class="stat">

                <span>
                    Peso líquido total
                </span>

                <b>
                    ${fmt(t.p1)} kg
                </b>

            </div>


            <div class="stat">

                <span>
                    Peso bruto total
                </span>

                <b>

                    ${
                        brutoTotal
                        ?
                        fmt(brutoTotal)+" kg"
                        :
                        "Não informado"
                    }

                </b>

            </div>


            <div class="stat">

                <span>
                    Itens
                </span>

                <b>
                    ${t.items}
                </b>

            </div>


            <div class="stat">

                <span>
                    Pendências
                </span>

                <b>
                    ${t.pending}
                </b>

            </div>

        </div>

    `;


    app.appendChild(resumo);


    /* ======================================================
       PALLETS
    ====================================================== */

    state.pallets.forEach(
        (pallet,pi)=>{


            const card =
                document.createElement(
                    "section"
                );


            card.className =
                "card editor-only";


            card.innerHTML=`

                <div class="pallet-head">

                    <div class="pallet-title">
                        Pallet ${pi+1}
                    </div>


                    <div class="actions">

                        ${
                            state.pallets.length > 1
                            ?
                            `
                            <button
                                class="danger"
                                onclick="
                                    removePallet(
                                        ${pallet.id}
                                    )
                                ">

                                Excluir pallet

                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                </div>


                <div class="small"
                     style="margin-bottom:12px">

                    Preencha o peso líquido de cada item.
                    O peso bruto do pallet é opcional.

                </div>

            `;


            const lista =
                document.createElement(
                    "div"
                );


            /* ==================================================
               ITENS
            ================================================== */

            pallet.items.forEach(
                (item,ii)=>{


                    const linha =
                        document.createElement(
                            "div"
                        );


                    linha.className =
                        "item";


                    const preenchido =
                        item.p1 !== "" &&
                        item.p1 !== null &&
                        item.p1 !== undefined;


                    linha.innerHTML=`

                        <div class="item-head">

                            <div class="item-num">

                                Item ${ii+1}

                            </div>


                            <div class="actions">

                                <div
                                    class="
                                        item-status
                                        ${preenchido?"ok":""}
                                    ">

                                    ${
                                        preenchido
                                        ?
                                        "✓ preenchido"
                                        :
                                        "Pendente"
                                    }

                                </div>


                                ${
                                    pallet.items.length > 1
                                    ?
                                    `
                                    <button
                                        class="danger"
                                        style="
                                            padding:7px 9px;
                                            font-size:11px
                                        "
                                        onclick="
                                            removeItem(
                                                ${pallet.id},
                                                ${ii}
                                            )
                                        ">

                                        Excluir item

                                    </button>
                                    `
                                    :
                                    ""
                                }

                            </div>

                        </div>


                        <div class="row">

                            <div>

                                <label>
                                    Número
                                </label>

                                <input
                                    inputmode="numeric"
                                    value="${esc(item.numero)}"
                                    onchange="
                                        updateItem(
                                            ${pallet.id},
                                            ${ii},
                                            'numero',
                                            this.value
                                        )
                                    ">

                            </div>


                            <div>

                                <label>
                                    Peso líquido (kg)
                                </label>

                                <input
                                    type="number"
                                    inputmode="decimal"
                                    step="0.01"
                                    min="0"
                                    placeholder="0,00"
                                    value="${esc(item.p1)}"
                                    onchange="
                                        updateItem(
                                            ${pallet.id},
                                            ${ii},
                                            'p1',
                                            this.value
                                        )
                                    ">

                            </div>

                        </div>

                    `;


                    lista.appendChild(linha);

                }
            );


            card.appendChild(lista);


            /* ==================================================
               PESO BRUTO
            ================================================== */

            const bruto =
                document.createElement(
                    "div"
                );


            bruto.className =
                "pallet-bruto";


            bruto.innerHTML=`

                <label>

                    Peso Bruto do pallet

                    <span class="small">
                        (opcional)
                    </span>

                </label>


                <input
                    type="number"
                    inputmode="decimal"
                    step="0.01"
                    min="0"
                    placeholder="0,00"
                    value="${esc(pallet.bruto)}"
                    onchange="
                        updateBruto(
                            ${pallet.id},
                            this.value
                        )
                    ">

            `;


            card.appendChild(bruto);


            /* ==================================================
               ADICIONAR ITEM
            ================================================== */

            if(
                pallet.items.length < 5
            ){

                const adicionar =
                    document.createElement(
                        "button"
                    );


                adicionar.className =
                    "secondary full";


                adicionar.textContent =
                    "＋ Adicionar item";


                adicionar.onclick =
                    () =>
                        addItem(
                            pallet.id
                        );


                card.appendChild(
                    adicionar
                );

            }


            app.appendChild(card);

        }
    );


    /* ======================================================
       CARTÃO FINAL
    ====================================================== */

    const finalCard =
        document.createElement(
            "div"
        );


    finalCard.className =
        "final-card";


    finalCard.id =
        "finalCard";


    finalCard.innerHTML=`

        <div class="final-title">
            ROMANEIO INTERNO
        </div>


        <div class="final-info">

            <div class="final-field">
                <span>Cliente</span>
                <b id="f-cliente"></b>
            </div>


            <div class="final-field">
                <span>Item</span>
                <b id="f-item"></b>
            </div>


            <div class="final-field">
                <span>Nº do lote</span>
                <b id="f-lote"></b>
            </div>


            <div class="final-field">
                <span>Data de produção</span>
                <b id="f-data"></b>
            </div>


            <div class="final-field">
                <span>Dimensão</span>
                <b id="f-dimensao"></b>
            </div>


            <div class="final-field">
                <span>Pallets / Itens</span>
                <b id="f-qtd"></b>
            </div>

        </div>


        <div class="weight-total">

            <div class="weight-box">

                <span>
                    Peso Líquido Total
                </span>

                <b id="f-p1"></b>

            </div>


            <div class="weight-box">

                <span>
                    Peso Bruto Total
                </span>

                <b id="f-p2"></b>

            </div>

        </div>

    `;


    app.appendChild(
        finalCard
    );


    /* ======================================================
       BOTÕES FINAIS
    ====================================================== */

    const actions =
        document.createElement(
            "div"
        );


    actions.className =
        "final-actions";


    actions.innerHTML=`

        <button
            class="primary"
            onclick="compartilharImagem()">

            ↗ Compartilhar imagem

        </button>


        <button
            class="secondary"
            onclick="voltarEditar()">

            ← Voltar e alterar

        </button>


        <button
            class="secondary"
            onclick="novoRomaneio()">

            ＋ Novo romaneio

        </button>

    `;


    app.appendChild(actions);

}


/* ==========================================================
   ATUALIZA DADOS
========================================================== */

function updateInfo(
    key,
    valor
){

    state.info[key]=valor;

    save();

}


/* ==========================================================
   ATUALIZA BRUTO
========================================================== */

function updateBruto(
    pid,
    valor
){

    const pallet =
        state.pallets.find(
            p=>p.id===pid
        );


    if(!pallet) return;


    pallet.bruto =
        valor;


    save();

    render();

}


/* ==========================================================
   ATUALIZA ITEM
========================================================== */

function updateItem(
    pid,
    ii,
    key,
    valor
){

    const pallet =
        state.pallets.find(
            p=>p.id===pid
        );


    if(!pallet) return;


    if(!pallet.items[ii])
        return;


    pallet.items[ii][key]=
        valor;


    save();

    render();

}


/* ==========================================================
   ADICIONAR ITEM
========================================================== */

function addItem(pid){

    const pallet =
        state.pallets.find(
            p=>p.id===pid
        );


    if(!pallet)
        return;


    if(
        pallet.items.length >= 5
    ){

        alert(
            "Cada pallet pode ter no máximo 5 itens."
        );

        return;

    }


    pallet.items.push({

        numero:
            pallet.items.length+1,

        p1:""

    });


    save();

    render();

}


/* ==========================================================
   EXCLUIR ITEM
========================================================== */

function removeItem(
    pid,
    ii
){

    const pallet =
        state.pallets.find(
            p=>p.id===pid
        );


    if(!pallet)
        return;


    if(
        pallet.items.length <= 1
    ){

        alert(
            "O pallet precisa ter pelo menos 1 item."
        );

        return;

    }


    if(
        !confirm(
            "Excluir este item?"
        )
    ){

        return;

    }


    pallet.items.splice(
        ii,
        1
    );


    /*
       RENÚMERA OS ITENS
       APÓS A EXCLUSÃO
    */

    pallet.items.forEach(
        (item,index)=>{

            item.numero =
                index+1;

        }
    );


    save();

    render();

}


/* ==========================================================
   ADICIONAR PALLET
========================================================== */

function addPallet(){

    state.pallets.push(
        criarPallet()
    );


    save();

    render();


    setTimeout(
        ()=>{
            window.scrollTo({
                top:
                    document.body.scrollHeight,
                behavior:"smooth"
            });
        },
        100
    );

}


/* ==========================================================
   EXCLUIR PALLET
========================================================== */

function removePallet(
    pid
){

    if(
        state.pallets.length <= 1
    ){

        alert(
            "O romaneio precisa ter pelo menos 1 pallet."
        );

        return;

    }


    if(
        !confirm(
            "Excluir este pallet e todos os seus itens?"
        )
    ){

        return;

    }


    state.pallets =
        state.pallets.filter(
            p=>p.id!==pid
        );


    save();

    render();

}


/* ==========================================================
   FINALIZAR
========================================================== */

function finalizar(){

    const t =
        totals();


    if(
        t.pending > 0
    ){

        alert(
            "Ainda existem " +
            t.pending +
            " item(ns) sem peso líquido preenchido."
        );

        return;

    }


    const required=[

        [
            "Cliente",
            state.info.cliente
        ],

        [
            "Item",
            state.info.item
        ],

        [
            "Nº do lote",
            state.info.lote
        ],

        [
            "Data de produção",
            state.info.data
        ],

        [
            "Dimensão",
            state.info.dimensao
        ]

    ];


    const missing =
        required
            .filter(
                x=>!x[1]
            )
            .map(
                x=>x[0]
            );


    if(
        missing.length
    ){

        alert(
            "Preencha antes de finalizar:\n\n" +
            missing.join("\n")
        );

        return;

    }


    const brutoTotal =
        state.pallets.reduce(
            (s,p)=>
                s+num(p.bruto),
            0
        );


    document.getElementById(
        "f-cliente"
    ).textContent =
        state.info.cliente;


    document.getElementById(
        "f-item"
    ).textContent =
        state.info.item;


    document.getElementById(
        "f-lote"
    ).textContent =
        state.info.lote;


    document.getElementById(
        "f-data"
    ).textContent =
        state.info.data
            .split("-")
            .reverse()
            .join("/");


    document.getElementById(
        "f-dimensao"
    ).textContent =
        state.info.dimensao;


    document.getElementById(
        "f-qtd"
    ).textContent =
        `${state.pallets.length} pallet${
            state.pallets.length===1
            ?
            ""
            :
            "s"
        } / ${t.items} itens`;


    document.getElementById(
        "f-p1"
    ).textContent =
        fmt(t.p1)+" kg";


    document.getElementById(
        "f-p2"
    ).textContent =
        brutoTotal
        ?
        fmt(brutoTotal)+" kg"
        :
        "Não informado";


    document.body.classList.add(
        "final-mode"
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ==========================================================
   VOLTAR
========================================================== */

function voltarEditar(){

    document.body.classList.remove(
        "final-mode"
    );


    render();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ==========================================================
   NOVO ROMANEIO
========================================================== */

function novoRomaneio(){

    if(
        !confirm(
            "Iniciar um novo romaneio? Todas as informações e pesos preenchidos serão apagados."
        )
    ){

        return;

    }


    state={

        info:{

            cliente:"",
            item:"",
            lote:"",
            data:"",
            dimensao:""

        },

        pallets:[
            criarPallet()
        ]

    };


    save();


    document.body.classList.remove(
        "final-mode"
    );


    render();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ==========================================================
   ESCAPE HTML
========================================================== */

function esc(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==========================================================
   COMPARTILHAR IMAGEM
========================================================== */

function compartilharImagem(){

    try{

        const t =
            totals();


        const brutoTotal =
            state.pallets.reduce(
                (s,p)=>
                    s+num(p.bruto),
                0
            );


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width=1800;

        canvas.height=1520;


        const ctx =
            canvas.getContext(
                "2d"
            );


        /* ==================================================
           FUNÇÃO RETÂNGULO ARREDONDADO
        ================================================== */

        function roundRect(
            x,
            y,
            w,
            h,
            r
        ){

            ctx.beginPath();

            ctx.moveTo(
                x+r,
                y
            );

            ctx.lineTo(
                x+w-r,
                y
            );

            ctx.quadraticCurveTo(
                x+w,
                y,
                x+w,
                y+r
            );

            ctx.lineTo(
                x+w,
                y+h-r
            );

            ctx.quadraticCurveTo(
                x+w,
                y+h,
                x+w-r,
                y+h
            );

            ctx.lineTo(
                x+r,
                y+h
            );

            ctx.quadraticCurveTo(
                x,
                y+h,
                x,
                y+h-r
            );

            ctx.lineTo(
                x,
                y+r
            );

            ctx.quadraticCurveTo(
                x,
                y,
                x+r,
                y
            );

            ctx.closePath();

        }


        /* ==================================================
           FUNÇÃO CAMPO
        ================================================== */

        function campo(
            x,
            y,
            titulo,
            valor
        ){

            ctx.fillStyle=
                "#f9fafb";


            roundRect(
                x,
                y,
                730,
                150,
                22
            );


            ctx.fill();


            ctx.textAlign=
                "left";


            ctx.fillStyle=
                "#6b7280";


            ctx.font=
                "500 28px Arial";


            ctx.fillText(
                titulo,
                x+30,
                y+45
            );


            ctx.fillStyle=
                "#111827";


            ctx.font=
                "700 34px Arial";


            let texto =
                String(
                    valor || "-"
                );


            if(
                texto.length > 32
            ){

                texto =
                    texto.substring(
                        0,
                        29
                    ) +
                    "...";

            }


            ctx.fillText(
                texto,
                x+30,
                y+93
            );

        }


        /* ==================================================
           FUNDO
        ================================================== */

        ctx.fillStyle=
            "#f3f4f6";


        ctx.fillRect(
            0,
            0,
            1800,
            1520
        );


        /* ==================================================
           CARTÃO
        ================================================== */

        ctx.fillStyle=
            "#ffffff";


        ctx.strokeStyle=
            "#111827";


        ctx.lineWidth=5;


        roundRect(
            80,
            60,
            1640,
            1400,
            40
        );


        ctx.fill();

        ctx.stroke();


        /* ==================================================
           TÍTULO
        ================================================== */

        ctx.textAlign=
            "center";


        ctx.fillStyle=
            "#111827";


        ctx.font=
            "900 58px Arial";


        ctx.fillText(
            "ROMANEIO INTERNO",
            900,
            145
        );


        /* ==================================================
           LINHA
        ================================================== */

        ctx.strokeStyle=
            "#e5e7eb";


        ctx.lineWidth=3;


        ctx.beginPath();

        ctx.moveTo(
            140,
            185
        );

        ctx.lineTo(
            1660,
            185
        );

        ctx.stroke();


        /* ==================================================
           CAMPOS
        ================================================== */

        campo(
            140,
            240,
            "Cliente",
            state.info.cliente
        );


        campo(
            930,
            240,
            "Item",
            state.info.item
        );


        campo(
            140,
            430,
            "Nº do lote",
            state.info.lote
        );


        campo(
            930,
            430,
            "Data de produção",
            state.info.data
                ?
                state.info.data
                    .split("-")
                    .reverse()
                    .join("/")
                :
                ""
        );


        campo(
            140,
            620,
            "Dimensão",
            state.info.dimensao
        );


        campo(
            930,
            620,
            "Pallets / Itens",
            `${state.pallets.length} pallet${
                state.pallets.length===1
                ?
                ""
                :
                "s"
            } / ${t.items} itens`
        );


        /* ==================================================
           DIVISÓRIA
        ================================================== */

        ctx.strokeStyle=
            "#e5e7eb";


        ctx.beginPath();

        ctx.moveTo(
            140,
            830
        );

        ctx.lineTo(
            1660,
            830
        );

        ctx.stroke();


        /* ==================================================
           PESO LÍQUIDO
        ================================================== */

        ctx.fillStyle=
            "#f3f4f6";


        roundRect(
            140,
            890,
            730,
            260,
            30
        );


        ctx.fill();


        ctx.textAlign=
            "center";


        ctx.fillStyle=
            "#6b7280";


        ctx.font=
            "600 30px Arial";


        ctx.fillText(
            "Peso Líquido Total",
            505,
            965
        );


        ctx.fillStyle=
            "#111827";


        ctx.font=
            "900 58px Arial";


        ctx.fillText(
            `${fmt(t.p1)} kg`,
            505,
            1060
        );


        /* ==================================================
           PESO BRUTO
        ================================================== */

        ctx.fillStyle=
            "#f3f4f6";


        roundRect(
            930,
            890,
            730,
            260,
            30
        );


        ctx.fill();


        ctx.fillStyle=
            "#6b7280";


        ctx.font=
            "600 30px Arial";


        ctx.fillText(
            "Peso Bruto Total",
            1295,
            965
        );


        ctx.fillStyle=
            "#111827";


        ctx.font=
            "900 58px Arial";


        ctx.fillText(
            brutoTotal
            ?
            `${fmt(brutoTotal)} kg`
            :
            "Não informado",
            1295,
            1060
        );


        /* ==================================================
           RODAPÉ
        ================================================== */

        ctx.fillStyle=
            "#6b7280";


        ctx.font=
            "24px Arial";


        ctx.fillText(
            "Romaneio interno",
            900,
            1335
        );


        /* ==================================================
           CONVERTE PARA PNG
        ================================================== */

        const dataURL =
            canvas.toDataURL(
                "image/png"
            );


        /* ==================================================
           CONVERTE BASE64 PARA ARQUIVO
        ================================================== */

        const base64 =
            dataURL.split(",")[1];


        const binary =
            atob(base64);


        const bytes =
            new Uint8Array(
                binary.length
            );


        for(
            let i=0;
            i<binary.length;
            i++
        ){

            bytes[i] =
                binary.charCodeAt(i);

        }


        const arquivo =
            new File(
                [bytes],
                "romaneio-interno.png",
                {
                    type:"image/png"
                }
            );


        /* ==================================================
           COMPARTILHAMENTO NATIVO
        ================================================== */

        if(
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
                files:[arquivo]
            })
        ){

            navigator.share({

                title:
                    "Romaneio Interno",

                text:
                    "Romaneio Interno",

                files:[
                    arquivo
                ]

            })
            .catch(
                erro=>{

                    if(
                        erro.name !==
                        "AbortError"
                    ){

                        abrirImagem(
                            dataURL
                        );

                    }

                }
            );


            return;

        }


        /* ==================================================
           FALLBACK
        ================================================== */

        abrirImagem(
            dataURL
        );

    }

    catch(erro){

        console.error(
            erro
        );


        alert(
            "Não foi possível gerar a imagem."
        );

    }

}


/* ==========================================================
   ABRIR IMAGEM NO NAVEGADOR
========================================================== */

function abrirImagem(
    dataURL
){

    const novaAba =
        window.open(
            "",
            "_blank"
        );


    if(!novaAba){

        alert(
            "O navegador bloqueou a abertura da imagem. Permita pop-ups e tente novamente."
        );

        return;

    }


    novaAba.document.write(`

        <!doctype html>

        <html>

        <head>

            <meta
                name="viewport"
                content="
                    width=device-width,
                    initial-scale=1
                ">

            <title>
                Romaneio Interno
            </title>

            <style>

                body{

                    margin:0;

                    padding:20px;

                    background:#f3f4f6;

                    text-align:center;

                    font-family:Arial;

                }

                img{

                    max-width:100%;

                    height:auto;

                }

                p{

                    color:#555;

                    font-size:16px;

                }

            </style>

        </head>


        <body>

            <p>
                Pressione e segure a imagem
                para salvar ou compartilhar.
            </p>

            <img
                src="${dataURL}"
                alt="Romaneio Interno">

        </body>

        </html>

    `);


    novaAba.document.close();

}
