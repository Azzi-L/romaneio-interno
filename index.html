<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>ROMANEIO INTERNO</title>

<style>

/* ============================= */
/* CONFIGURAÇÕES GERAIS */
/* ============================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f1f3f6;
    color: #111827;

    padding-bottom: 100px;
}

/* ============================= */
/* CABEÇALHO */
/* ============================= */

.header {

    height: 76px;

    background: #111827;

    color: white;

    display: flex;

    align-items: center;

    padding: 0 22px;

    position: sticky;

    top: 0;

    z-index: 20;
}

.header-title {

    font-size: 24px;

    font-weight: 800;

    letter-spacing: .3px;
}

.header-new {

    margin-left: auto;

    border: none;

    background: #f3f4f6;

    color: #111827;

    border-radius: 13px;

    padding: 12px 18px;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;
}

/* ============================= */
/* CONTAINER */
/* ============================= */

.container {

    max-width: 700px;

    margin: 16px auto;

    padding: 0 14px;
}

/* ============================= */
/* CARDS */
/* ============================= */

.card {

    background: white;

    border: 1px solid #e1e5ea;

    border-radius: 17px;

    padding: 16px;

    margin-bottom: 14px;

    box-shadow:
        0 2px 7px rgba(0,0,0,.04);
}

.card-title {

    font-size: 20px;

    font-weight: 800;

    margin-bottom: 14px;
}

/* ============================= */
/* CAMPOS */
/* ============================= */

.grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;
}

.field {

    display: flex;

    flex-direction: column;
}

.field.full {

    grid-column:
        1 / -1;
}

label {

    font-size: 13px;

    color: #475569;

    margin-bottom: 6px;
}

input {

    width: 100%;

    height: 46px;

    border:
        1px solid #cbd5e1;

    border-radius: 11px;

    padding:
        0 12px;

    font-size: 16px;

    background: white;

    color: #111827;

    outline: none;
}

input:focus {

    border-color:
        #111827;
}

/* ============================= */
/* RESUMO */
/* ============================= */

.summary-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}

.summary-box {

    background: #f7f8fa;

    border-radius: 13px;

    padding: 13px;
}

.summary-label {

    font-size: 13px;

    color: #64748b;
}

.summary-value {

    font-size: 21px;

    font-weight: 800;

    margin-top: 4px;
}

/* ============================= */
/* PALLET */
/* ============================= */

.pallet-title {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;
}

.pallet-title h2 {

    margin: 0;

    font-size: 20px;
}

.remove-pallet {

    border: none;

    background: #fee2e2;

    color: #b91c1c;

    border-radius: 9px;

    padding:
        8px 10px;

    font-weight: 700;

    cursor: pointer;
}

.help {

    color: #64748b;

    font-size: 13px;

    margin:
        8px 0 16px;
}

/* ============================= */
/* ITEM */
/* ============================= */

.item {

    border-top:
        1px solid #e5e7eb;

    padding-top: 14px;

    margin-top: 14px;
}

.item:first-of-type {

    border-top: none;

    padding-top: 0;

    margin-top: 0;
}

.item-head {

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    margin-bottom: 9px;

    gap: 8px;
}

.item-name {

    font-weight: 800;
}

.item-status {

    color: #008a4b;

    font-size: 12px;
}

.item-head-right {

    display: flex;

    gap: 8px;

    align-items: center;
}

/* ============================= */
/* BOTÃO EXCLUIR ITEM */
/* ============================= */

.remove-item {

    border: none;

    background: #fee2e2;

    color: #b91c1c;

    border-radius: 9px;

    padding:
        7px 10px;

    font-weight: 700;

    cursor: pointer;

    white-space: nowrap;
}

/* ============================= */
/* CAMPOS DOS ITENS */
/* ============================= */

.item-fields {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}

/* ============================= */
/* PESO BRUTO */
/* ============================= */

.bruto {

    margin-top: 15px;

    padding-top: 14px;

    border-top:
        1px dashed #d1d5db;
}

.bruto-title {

    font-size: 13px;

    color: #475569;

    margin-bottom: 6px;
}

/* ============================= */
/* ADICIONAR ITEM */
/* ============================= */

.add-item {

    width: 100%;

    height: 44px;

    margin-top: 14px;

    border:
        1px dashed #94a3b8;

    background: #f8fafc;

    border-radius: 11px;

    font-weight: 700;

    color: #334155;

    cursor: pointer;
}

/* ============================= */
/* BARRA INFERIOR */
/* ============================= */

.bottom {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    background: white;

    border-top:
        1px solid #dbe0e6;

    padding:
        10px 14px;

    display: flex;

    gap: 8px;

    z-index: 30;
}

.bottom button {

    flex: 1;

    height: 48px;

    border: none;

    border-radius: 12px;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;
}

.btn-light {

    background: #eef0f2;

    color: #111827;
}

.btn-dark {

    background: #111827;

    color: white;
}

/* ============================= */
/* TELA FINAL */
/* ============================= */

.final-page {

    padding:
        20px 14px 30px;
}

.final-card {

    max-width: 700px;

    margin: 0 auto;

    background: white;

    border:
        1.5px solid #111827;

    border-radius: 18px;

    padding: 18px;
}

/* ============================= */
/* CABEÇALHO FINAL */
/* ============================= */

.final-header {

    display: flex;

    justify-content:
        center;

    align-items:
        center;

    border-bottom:
        2px solid #e5e7eb;

    padding-bottom: 17px;

    margin-bottom: 18px;
}

.final-title {

    font-size: 27px;

    font-weight: 900;

    letter-spacing: 1px;

    text-align: center;
}

/* ============================= */
/* INFORMAÇÕES FINAIS */
/* ============================= */

.final-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}

.final-info {

    background: #f7f8fa;

    border-radius: 12px;

    padding: 12px;
}

.final-label {

    color: #6b7280;

    font-size: 13px;
}

.final-value {

    font-weight: 800;

    font-size: 16px;

    margin-top: 4px;
}

.final-line {

    border-top:
        2px solid #e5e7eb;

    margin:
        18px 0;
}

/* ============================= */
/* PESOS FINAIS */
/* ============================= */

.final-weight-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;
}

.final-weight {

    background: #f3f4f6;

    border-radius: 15px;

    text-align: center;

    padding:
        22px 10px;
}

.final-weight-label {

    color: #6b7280;

    font-size: 15px;

    font-weight: 700;
}

.final-weight-value {

    font-size: 30px;

    font-weight: 900;

    margin-top: 10px;
}

.final-footer {

    text-align: center;

    color: #6b7280;

    margin-top: 70px;

    font-size: 14px;
}

/* ============================= */
/* BOTÕES FINAIS */
/* ============================= */

.final-buttons {

    max-width: 700px;

    margin:
        14px auto 0;

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 8px;
}

.final-buttons button {

    height: 48px;

    border: none;

    border-radius: 12px;

    font-weight: 800;

    font-size: 14px;

    cursor: pointer;
}

.share {

    background: #111827;

    color: white;
}

.back {

    background: #eef0f2;
}

.new {

    background: #eef0f2;
}

/* ============================= */
/* CELULAR */
/* ============================= */

@media(max-width:600px) {

    .header {

        height: 72px;

        padding:
            0 16px;
    }

    .header-title {

        font-size: 21px;
    }

    .grid,
    .summary-grid,
    .final-grid,
    .final-weight-grid,
    .item-fields {

        grid-template-columns:
            1fr 1fr;
    }

    .final-title {

        font-size: 22px;
    }

    .final-buttons {

        grid-template-columns:
            1fr 1fr 1fr;
    }

    .final-buttons button {

        font-size: 12px;
    }

    .remove-item {

        font-size: 11px;

        padding:
            6px 8px;
    }
}

</style>

</head>

<body>

<div id="app"></div>

<script>

/* ================================= */
/* DADOS DO ROMANEIO */
/* ================================= */

let pallets = [

    {

        items: [

            {
                numero: 1,
                liquido: ""
            }

        ],

        bruto: ""

    }

];


/* ================================= */
/* DADOS PRINCIPAIS */
/* ================================= */

let dados = {

    cliente: "",

    item: "",

    lote: "",

    data: "",

    dimensao: ""

};


/* ================================= */
/* CONTROLE DA TELA */
/* ================================= */

let telaFinal = false;


/* ================================= */
/* DATA ATUAL */
/* ================================= */

function dataHoje() {

    const d = new Date();

    const ano =
        d.getFullYear();

    const mes =
        String(
            d.getMonth() + 1
        ).padStart(2, "0");

    const dia =
        String(
            d.getDate()
        ).padStart(2, "0");

    return (
        ano +
        "-" +
        mes +
        "-" +
        dia
    );
}


/* ================================= */
/* FORMATA DATA */
/* ================================= */

function formatarData(valor) {

    if (!valor) return "";

    const partes =
        valor.split("-");

    if (partes.length !== 3) {

        return valor;

    }

    return (

        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]

    );
}


/* ================================= */
/* PROTEÇÃO HTML */
/* ================================= */

function escapeHtml(text) {

    return String(
        text ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* ================================= */
/* CONVERTE PESO */
/* ================================= */

function valorNumerico(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return NaN;

    }

    return parseFloat(

        String(valor)
            .replace(",", ".")

    );

}


/* ================================= */
/* FORMATA PESO */
/* ================================= */

function formatPeso(valor) {

    if (
        valor === null ||
        valor === undefined ||
        isNaN(valor)
    ) {

        return "0";

    }

    return Number(valor)
        .toLocaleString(
            "pt-BR",
            {
                maximumFractionDigits: 2
            }
        );

}


/* ================================= */
/* CALCULA PENDÊNCIAS */
/* ================================= */

function calcularPendencias() {

    let pendencias = 0;

    pallets.forEach(

        pallet => {

            pallet.items.forEach(

                item => {

                    if (

                        item.liquido === "" ||

                        isNaN(
                            valorNumerico(
                                item.liquido
                            )
                        )

                    ) {

                        pendencias++;

                    }

                }

            );

        }

    );

    return pendencias;

}


/* ================================= */
/* RENDERIZA A TELA */
/* ================================= */

function render() {

    if (telaFinal) {

        renderFinal();

        return;

    }


    let html = "";


/* ================================= */
/* CABEÇALHO */
/* ================================= */

    html += `

    <div class="header">

        <div class="header-title">
            ROMANEIO INTERNO
        </div>

        <button
            class="header-new"
            onclick="novoRomaneio()">

            + Novo

        </button>

    </div>

    `;


/* ================================= */
/* CONTAINER */
/* ================================= */

    html += `

    <div class="container">

    `;


/* ================================= */
/* DADOS DO ROMANEIO */
/* ================================= */

    html += `

    <div class="card">

        <div class="card-title">
            Dados do Romaneio
        </div>

        <div class="grid">


            <div class="field full">

                <label>
                    Cliente
                </label>

                <input
                    value="${escapeHtml(dados.cliente)}"
                    placeholder="Digite o cliente"
                    oninput="dados.cliente=this.value">

            </div>


            <div class="field">

                <label>
                    Item
                </label>

                <input
                    value="${escapeHtml(dados.item)}"
                    placeholder="Item"
                    oninput="dados.item=this.value">

            </div>


            <div class="field">

                <label>
                    Nº do lote
                </label>

                <input
                    value="${escapeHtml(dados.lote)}"
                    placeholder="Lote"
                    oninput="dados.lote=this.value">

            </div>


            <div class="field">

                <label>
                    Data de produção
                </label>

                <input
                    type="date"
                    value="${dados.data}"
                    onchange="dados.data=this.value">

            </div>


            <div class="field">

                <label>
                    Dimensão
                </label>

                <input
                    value="${escapeHtml(dados.dimensao)}"
                    placeholder="Ex.: 100 x 200 mm"
                    oninput="dados.dimensao=this.value">

            </div>


        </div>

    </div>

    `;


/* ================================= */
/* TOTAIS */
/* ================================= */

    let totalLiquido = 0;

    let totalBruto = 0;

    let quantidadeItens = 0;


    pallets.forEach(

        pallet => {

            pallet.items.forEach(

                item => {

                    const peso =
                        valorNumerico(
                            item.liquido
                        );

                    if (
                        !isNaN(peso)
                    ) {

                        totalLiquido +=
                            peso;

                    }

                    quantidadeItens++;

                }

            );


            const bruto =
                valorNumerico(
                    pallet.bruto
                );

            if (
                !isNaN(bruto)
            ) {

                totalBruto +=
                    bruto;

            }

        }

    );


/* ================================= */
/* RESUMO */
/* ================================= */

    html += `

    <div class="card">

        <div
            class="card-title"
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
            ">

            <span>
                Resumo
            </span>

            <span
                style="
                    background:#f1f3f5;
                    padding:6px 10px;
                    border-radius:20px;
                    font-size:12px;
                    font-weight:500;
                ">

                ${pallets.length}
                pallet${pallets.length !== 1 ? "s" : ""}

            </span>

        </div>


        <div class="summary-grid">


            <div class="summary-box">

                <div class="summary-label">
                    Peso Líquido Total
                </div>

                <div class="summary-value">
                    ${formatPeso(totalLiquido)} kg
                </div>

            </div>


            <div class="summary-box">

                <div class="summary-label">
                    Peso Bruto Total
                </div>

                <div class="summary-value">

                    ${
                        totalBruto > 0
                        ? formatPeso(totalBruto) + " kg"
                        : "Não informado"
                    }

                </div>

            </div>


            <div class="summary-box">

                <div class="summary-label">
                    Itens
                </div>

                <div class="summary-value">
                    ${quantidadeItens}
                </div>

            </div>


            <div class="summary-box">

                <div class="summary-label">
                    Pendências
                </div>

                <div class="summary-value">
                    ${calcularPendencias()}
                </div>

            </div>


        </div>

    </div>

    `;


/* ================================= */
/* PALLETS */
/* ================================= */

    pallets.forEach(

        (pallet, pi) => {


            html += `

            <div class="card">

                <div class="pallet-title">

                    <h2>
                        Pallet ${pi + 1}
                    </h2>


                    ${
                        pallets.length > 1
                        ? `

                        <button
                            class="remove-pallet"
                            onclick="removerPallet(${pi})">

                            Excluir pallet

                        </button>

                        `
                        : ""
                    }

                </div>


                <div class="help">

                    Preencha o peso líquido
                    de cada item.

                    O peso bruto do pallet
                    é opcional.

                </div>

            `;


/* ================================= */
/* ITENS */
/* ================================= */

            pallet.items.forEach(

                (item, ii) => {


                    const preenchido =

                        item.liquido !== "" &&

                        !isNaN(
                            valorNumerico(
                                item.liquido
                            )
                        );


                    html += `

                    <div class="item">


                        <div class="item-head">


                            <span class="item-name">

                                Item ${ii + 1}

                            </span>


                            <div
                                class="item-head-right">


                                <span
                                    class="item-status">

                                    ${
                                        preenchido
                                        ? "✓ preenchido"
                                        : ""
                                    }

                                </span>


                                <!--
                                BOTÃO EXCLUIR
                                APARECE SEMPRE
                                -->

                                <button
                                    class="remove-item"
                                    onclick="
                                        removerItem(
                                            ${pi},
                                            ${ii}
                                        )
                                    ">

                                    Excluir item

                                </button>


                            </div>


                        </div>


                        <div class="item-fields">


                            <div class="field">

                                <label>
                                    Número
                                </label>

                                <input
                                    type="number"
                                    value="${item.numero}"
                                    onchange="
                                        alterarNumero(
                                            ${pi},
                                            ${ii},
                                            this.value
                                        )
                                    ">

                            </div>


                            <div class="field">

                                <label>
                                    Peso líquido (kg)
                                </label>

                                <input
                                    type="number"
                                    step="0.01"
                                    inputmode="decimal"
                                    placeholder="0,00"
                                    value="${escapeHtml(item.liquido)}"
                                    oninput="
                                        alterarLiquido(
                                            ${pi},
                                            ${ii},
                                            this.value
                                        )
                                    "
                                    onchange="
                                        atualizarDepoisDaEdicao()
                                    ">

                            </div>


                        </div>

                    </div>

                    `;

                }

            );


/* ================================= */
/* ADICIONAR ITEM */
/* ================================= */

            if (
                pallet.items.length < 5
            ) {

                html += `

                    <button
                        class="add-item"
                        onclick="
                            adicionarItem(${pi})
                        ">

                        + Adicionar item

                    </button>

                `;

            }


/* ================================= */
/* PESO BRUTO */
/* ================================= */

            html += `

                <div class="bruto">


                    <div class="bruto-title">

                        Peso Bruto do pallet
                        (opcional)

                    </div>


                    <input
                        type="number"
                        step="0.01"
                        inputmode="decimal"
                        placeholder="Digite o peso bruto"
                        value="${escapeHtml(pallet.bruto)}"
                        oninput="
                            alterarBruto(
                                ${pi},
                                this.value
                            )
                        "
                        onchange="
                            atualizarDepoisDaEdicao()
                        ">


                </div>


            </div>

            `;

        }

    );


/* ================================= */
/* FECHA CONTAINER */
/* ================================= */

    html += `

    </div>

    `;


/* ================================= */
/* BOTÕES INFERIORES */
/* ================================= */

    html += `

    <div class="bottom">


        <button
            class="btn-light"
            onclick="adicionarPallet()">

            + Adicionar pallet

        </button>


        <button
            class="btn-dark"
            onclick="finalizar()">

            ✓ Finalizar romaneio

        </button>


    </div>

    `;


/* ================================= */
/* COLOCA NA PÁGINA */
/* ================================= */

    document
        .getElementById("app")
        .innerHTML = html;

}


/* ================================= */
/* ALTERAR PESO LÍQUIDO */
/* ================================= */

function alterarLiquido(
    pi,
    ii,
    valor
) {

    pallets[pi]
        .items[ii]
        .liquido = valor;

}


/* ================================= */
/* ALTERAR PESO BRUTO */
/* ================================= */

function alterarBruto(
    pi,
    valor
) {

    pallets[pi]
        .bruto = valor;

}


/* ================================= */
/* ATUALIZAR APÓS EDIÇÃO */
/* ================================= */

function atualizarDepoisDaEdicao() {

    render();

}


/* ================================= */
/* ALTERAR NÚMERO */
/* ================================= */

function alterarNumero(
    pi,
    ii,
    valor
) {

    pallets[pi]
        .items[ii]
        .numero = valor;

}


/* ================================= */
/* ADICIONAR ITEM */
/* ================================= */

function adicionarItem(pi) {


    if (
        pallets[pi]
            .items
            .length >= 5
    ) {

        alert(
            "Cada pallet pode ter no máximo 5 itens."
        );

        return;

    }


    pallets[pi]
        .items
        .push({

            numero:
                pallets[pi]
                    .items
                    .length + 1,

            liquido: ""

        });


    render();

}


/* ================================= */
/* EXCLUIR ITEM */
/* ================================= */

function removerItem(
    pi,
    ii
) {


    if (
        pallets[pi]
            .items
            .length <= 1
    ) {

        alert(
            "O pallet precisa ter pelo menos 1 item."
        );

        return;

    }


    pallets[pi]
        .items
        .splice(
            ii,
            1
        );


/*
    REORGANIZA A NUMERAÇÃO
*/

    pallets[pi]
        .items
        .forEach(

            (item, index) => {

                item.numero =
                    index + 1;

            }

        );


    render();

}


/* ================================= */
/* ADICIONAR PALLET */
/* ================================= */

function adicionarPallet() {


    pallets.push({

        items: [

            {

                numero: 1,

                liquido: ""

            }

        ],

        bruto: ""

    });


    render();

}


/* ================================= */
/* EXCLUIR PALLET */
/* ================================= */

function removerPallet(pi) {


    if (
        pallets.length <= 1
    ) {

        alert(
            "O romaneio precisa ter pelo menos 1 pallet."
        );

        return;

    }


    pallets.splice(
        pi,
        1
    );


    render();

}


/* ================================= */
/* NOVO ROMANEIO */
/* ================================= */

function novoRomaneio() {


    const confirmar =
        confirm(
            "Deseja iniciar um novo romaneio? Os dados atuais serão apagados."
        );


    if (!confirmar) {

        return;

    }


    dados = {

        cliente: "",

        item: "",

        lote: "",

        data: dataHoje(),

        dimensao: ""

    };


    pallets = [

        {

            items: [

                {

                    numero: 1,

                    liquido: ""

                }

            ],

            bruto: ""

        }

    ];


    telaFinal = false;


    render();

}


/* ================================= */
/* FINALIZAR */
/* ================================= */

function finalizar() {


    const pendencias =
        calcularPendencias();


    if (
        pendencias > 0
    ) {


        const continuar =
            confirm(

                "Existem " +
                pendencias +
                " item(ns) sem peso líquido. Deseja finalizar mesmo assim?"

            );


        if (!continuar) {

            return;

        }

    }


    telaFinal = true;


    render();

}


/* ================================= */
/* VOLTAR */
/* ================================= */

function voltar() {

    telaFinal = false;

    render();

}


/* ================================= */
/* TELA FINAL */
/* ================================= */

function renderFinal() {


    let totalLiquido = 0;

    let totalBruto = 0;

    let totalItens = 0;

            pallet.items.forEach(

                        !isNaN(peso)
                    ) {

                        totalLiquido +=
                            peso;

                    }


                    totalItens++;

            );


            const bruto =
                valorNumerico(
                    pallet.bruto
                );


            if (
                !isNaN(bruto)
            ) {

                totalBruto +=
                    bruto;

            }

        }

    );

/* ================================= */
/* COMPARTILHAR */
/* ================================= */

async function compartilhar() {
    try {
        const canvas = document.createElement("canvas");

        const largura = 1200;
        const altura = 900;

        canvas.width = largura;
        canvas.height = altura;

        const ctx = canvas.getContext("2d");

        // Fundo
        ctx.fillStyle = "#f1f3f6";
        ctx.fillRect(0, 0, largura, altura);

        // Cartão principal
        const margem = 70;
        const cardX = margem;
        const cardY = 50;
        const cardW = largura - (margem * 2);
        const cardH = 800;

        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#111827";
        ctx.lineWidth = 3;

        roundRect(ctx, cardX, cardY, cardW, cardH, 25);
        ctx.fill();
        ctx.stroke();

        // Título
        ctx.fillStyle = "#111827";
        ctx.font = "900 42px Arial";
        ctx.textAlign = "center";
        ctx.fillText(
            "ROMANEIO INTERNO",
            largura / 2,
            125
        );

        // Linha
        ctx.strokeStyle = "#e5e7eb";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(110, 155);
        ctx.lineTo(1090, 155);
        ctx.stroke();

        // Função para desenhar os campos
        function campo(x, y, w, h, titulo, valor) {

            ctx.fillStyle = "#f7f8fa";
            roundRect(ctx, x, y, w, h, 18);
            ctx.fill();

            ctx.textAlign = "left";

            ctx.fillStyle = "#6b7280";
            ctx.font = "500 22px Arial";
            ctx.fillText(titulo, x + 25, y + 35);

            ctx.fillStyle = "#111827";
            ctx.font = "800 28px Arial";

            let texto = String(valor || "-");

            // Evita que textos muito grandes estourem o campo
            if (texto.length > 32) {
                texto = texto.substring(0, 29) + "...";
            }

            ctx.fillText(texto, x + 25, y + 75);
        }

        const campoW = 475;
        const campoH = 105;

        campo(
            110,
            190,
            campoW,
            campoH,
            "Cliente",
            dados.cliente
        );

        campo(
            615,
            190,
            campoW,
            campoH,
            "Item",
            dados.item
        );

        campo(
            110,
            315,
            campoW,
            campoH,
            "Nº do lote",
            dados.lote
        );

        campo(
            615,
            315,
            campoW,
            campoH,
            "Data de produção",
            formatarData(dados.data)
        );

        campo(
            110,
            440,
            campoW,
            campoH,
            "Dimensão",
            dados.dimensao
        );

        campo(
            615,
            440,
            campoW,
            campoH,
            "Pallets / Itens",
            `${pallets.length} pallet${pallets.length !== 1 ? "s" : ""} / ${totalItens} itens`
        );

        // Linha divisória
        ctx.strokeStyle = "#e5e7eb";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(110, 575);
        ctx.lineTo(1090, 575);
        ctx.stroke();

        // Calcula os pesos
        let totalLiquido = 0;
        let totalBruto = 0;

        pallets.forEach(pallet => {

            pallet.items.forEach(item => {
                const peso = valorNumerico(item.liquido);

                if (!isNaN(peso)) {
                    totalLiquido += peso;
                }
            });

            const bruto = valorNumerico(pallet.bruto);

            if (!isNaN(bruto)) {
                totalBruto += bruto;
            }
        });

        // Caixa peso líquido
        ctx.fillStyle = "#f3f4f6";
        roundRect(ctx, 110, 610, 475, 150, 20);
        ctx.fill();

        ctx.textAlign = "center";

        ctx.fillStyle = "#6b7280";
        ctx.font = "600 22px Arial";
        ctx.fillText(
            "Peso Líquido Total",
            347,
            655
        );

        ctx.fillStyle = "#111827";
        ctx.font = "900 42px Arial";
        ctx.fillText(
            `${formatPeso(totalLiquido)} kg`,
            347,
            715
        );

        // Caixa peso bruto
        ctx.fillStyle = "#f3f4f6";
        roundRect(ctx, 615, 610, 475, 150, 20);
        ctx.fill();

        ctx.fillStyle = "#6b7280";
        ctx.font = "600 22px Arial";
        ctx.fillText(
            "Peso Bruto Total",
            852,
            655
        );

        ctx.fillStyle = "#111827";
        ctx.font = "900 42px Arial";

        const brutoTexto =
            totalBruto > 0
                ? `${formatPeso(totalBruto)} kg`
                : "Não informado";

        ctx.fillText(
            brutoTexto,
            852,
            715
        );

        // Rodapé
        ctx.fillStyle = "#6b7280";
        ctx.font = "18px Arial";
        ctx.fillText(
            "Romaneio interno",
            largura / 2,
            815
        );

        // Converte para PNG
        canvas.toBlob(async function(blob) {

            if (!blob) {
                alert("Não foi possível gerar a imagem.");
                return;
            }

            const arquivo = new File(
                [blob],
                "romaneio-interno.png",
                {
                    type: "image/png"
                }
            );

            // Compartilhamento nativo do celular
            if (
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({ files: [arquivo] })
            ) {

                await navigator.share({
                    title: "Romaneio Interno",
                    text: "Romaneio Interno",
                    files: [arquivo]
                });

                return;
            }

            // Caso o navegador não permita compartilhar arquivo,
            // abre a imagem para o usuário salvar/compartilhar.
            const url = URL.createObjectURL(blob);

            const novaAba = window.open(url, "_blank");

            if (!novaAba) {
                const link = document.createElement("a");
                link.href = url;
                link.download = "romaneio-interno.png";
                document.body.appendChild(link);
                link.click();
                link.remove();
            }

            setTimeout(() => {
                URL.revokeObjectURL(url);
            }, 10000);

        }, "image/png");

    } catch (erro) {

        console.error("Erro ao compartilhar:", erro);

        alert(
            "Não foi possível compartilhar a imagem neste navegador. " +
            "Tente novamente ou use outro navegador."
        );
    }
}


// Desenha retângulos com cantos arredondados
function roundRect(ctx, x, y, width, height, radius) {

    ctx.beginPath();

    ctx.moveTo(x + radius, y);

    ctx.lineTo(x + width - radius, y);

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();
}

dados.data =
    dataHoje();


render();

</script>
